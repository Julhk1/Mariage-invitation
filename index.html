<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Julien & Vanessa — Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#fbf8f1; --paper-edge:#f3ecdb;
    --ink:#3a3226; --ink-soft:#847a66;
    --gold:#a9853f; --gold-deep:#8c6d33; --gold-light:#cdae76; --line:#e6dcc4;
    --ok-bg:#eef2e9; --ok-text:#4a6b41;
    --no-bg:#f5e9e5; --no-text:#a25a45;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 92% 4%, rgba(178,196,214,0.35), transparent 40%),
      radial-gradient(circle at 4% 96%, rgba(178,196,214,0.25), transparent 40%),
      linear-gradient(160deg, #eef0ee 0%, #e4e6e2 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    padding:40px 16px 70px;
    display:flex; flex-direction:column; align-items:center;
  }

  .card{
    width:100%; max-width:520px;
    background:var(--paper);
    border-radius:2px;
    box-shadow:0 40px 80px -30px rgba(30,26,18,0.35), 0 0 0 1px rgba(169,133,63,0.12);
    overflow:hidden; position:relative;
  }
  .card::before{ content:""; position:absolute; inset:12px; border:1px solid rgba(169,133,63,0.4); pointer-events:none; z-index:3; }

  .feather{ position:absolute; width:190px; opacity:0.5; pointer-events:none; z-index:1; }
  .feather.bl{ left:-46px; bottom:-30px; transform:rotate(-8deg); }
  .feather.tr{ right:-46px; top:-30px; transform:rotate(172deg); }

  .card-inner{ padding:56px 42px 46px; text-align:center; position:relative; z-index:2; }

  .monogram{ font-family:'Parisienne', cursive; font-size:44px; color:var(--gold-deep); margin-bottom:22px; }

  .eyebrow{ font-size:12px; letter-spacing:0.34em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:10px; }
  .parents-line{ font-family:'Parisienne', cursive; font-size:26px; color:var(--ink); margin-bottom:22px; line-height:1.3; }

  .invite-copy{ font-size:12.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); line-height:1.9; max-width:340px; margin:0 auto 26px; }

  .names{ font-family:'Parisienne', cursive; font-size:58px; line-height:1.08; margin-bottom:18px; color:var(--ink); }
  .names .amp{ color:var(--gold); font-size:36px; margin:0 6px; }

  .presented-by{ font-size:15px; color:var(--ink-soft); font-style:italic; max-width:360px; margin:0 auto 24px; line-height:1.55; }

  .rule{ width:70px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:22px auto; }

  .date-block{ margin:6px 0 26px; }
  .date-block .day{ font-size:13px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold-deep); }
  .date-block .big{ font-size:26px; letter-spacing:0.1em; margin-top:6px; font-weight:500; }

  .events{ display:flex; justify-content:center; gap:0; margin-bottom:6px; }
  .event{ flex:1; max-width:210px; padding:0 14px; }
  .event + .event{ border-left:1px solid var(--line); }
  .event .label{ text-transform:uppercase; font-size:11px; letter-spacing:0.18em; color:var(--gold-deep); margin-bottom:6px; }
  .event .place{ font-size:17px; font-weight:600; }
  .event .place a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--gold-light); transition:color .15s ease, border-color .15s ease; }
  .event .place a:hover{ color:var(--gold-deep); border-color:var(--gold-deep); }
  .event .sub{ font-size:14px; color:var(--ink-soft); font-style:italic; margin-top:2px; }

  .rsvp{ margin-top:34px; }
  .rsvp h2{ font-family:'Parisienne', cursive; font-weight:400; font-size:32px; }
  .rsvp .deadline{ font-style:italic; color:var(--ink-soft); font-size:14.5px; margin:2px 0 26px; }

  .guest-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .guest-row:last-of-type{ border-bottom:none; }
  .guest-name{ font-size:18px; font-weight:600; }

  .choice{ display:flex; gap:8px; }
  .pill{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:13.5px; padding:9px 15px; border-radius:30px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; transition:all .15s ease; }
  .pill:hover{ border-color:var(--gold); }
  .pill.attend.active{ background:var(--ok-bg); border-color:var(--ok-text); color:var(--ok-text); }
  .pill.decline.active{ background:var(--no-bg); border-color:var(--no-text); color:var(--no-text); }

  .submit-row{ margin-top:28px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .submit-btn{ font-family:'Cormorant Garamond', serif; text-transform:uppercase; letter-spacing:0.2em; font-size:12.5px; font-weight:600; background:var(--ink); color:var(--paper); border:none; padding:14px 42px; border-radius:2px; cursor:pointer; transition:background .15s ease; }
  .submit-btn:hover{ background:var(--gold-deep); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .status-msg{ font-size:14px; color:var(--ok-text); font-style:italic; min-height:18px; }
  .status-msg.error{ color:var(--no-text); }

  .loading, .error-box{ color:var(--ink-soft); font-style:italic; padding:48px 24px; text-align:center; }

  @media (max-width:480px){
    .monogram{font-size:36px;}
    .names{font-size:46px;}
    .card-inner{padding:44px 24px 36px;}
    .events{flex-direction:column; gap:18px;}
    .event + .event{border-left:none; border-top:1px solid var(--line); padding-top:16px;}
  }
</style>
</head>
<body>

    </svg>

    <div class="card-inner" id="cardInner">
      <div class="loading">Chargement de l'invitation…</div>
    </div>
  </div>

<script>
/* =========================================================
   1) CONFIGURATION — à remplacer par tes vraies valeurs
   Supabase > Settings > API > Project URL / anon public key
   ========================================================= */
const SUPABASE_URL = "https://dthppsntdwdtvqgwwbhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";

/* =========================================================
   2) PERSONNALISATION DE L'ÉVÉNEMENT — modifie ici
   ========================================================= */
const EVENT = {
  monogram: 'JV',

  // Laisse vide ('') pour masquer la ligne des parents si tu ne la veux pas
  parents_line: '',            // ex: 'Famille Hobeika & Famille Fakhri'
  invite_copy: "Ont le plaisir de vous convier au mariage de",

  names: 'Julien<span class="amp">&amp;</span>Vanessa',

  date_day: 'Samedi',
  date_big: '12 SEPTEMBRE 2026',

  ceremony_place: "Jardins de l'Olivier",
  ceremony_time: '17h30',
  ceremony_map_url: 'https://maps.app.goo.gl/EkdvBaw8zoqo9fZW8',   // mets ton vrai lien Google Maps ici

  reception_place: 'Domaine Beit Zahra',
  reception_time: '20h00',
  reception_map_url: 'https://maps.google.com/?q=Domaine+Beit+Zahra',      // mets ton vrai lien Google Maps ici

  deadline: 'Merci de confirmer avant le 25 août'
};
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cardInner = document.getElementById('cardInner');

function getSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get('invite');
}

function placeMarkup(name, url){
  return url ? `<a href="${url}" target="_blank" rel="noopener">${name}</a>` : name;
}

function renderShell(invite, guests){
  cardInner.innerHTML = `
    <div class="monogram">${EVENT.monogram}</div>

    ${EVENT.parents_line ? `
      <div class="eyebrow">Les familles de</div>
      <div class="parents-line">${EVENT.parents_line}</div>
    ` : ''}

    <div class="invite-copy">${EVENT.invite_copy}</div>

    <div class="names">${EVENT.names}</div>
    <p class="presented-by">${invite.note || ''}</p>

    <div class="rule"></div>

    <div class="date-block">
      <div class="day">${EVENT.date_day}</div>
      <div class="big">${EVENT.date_big}</div>
    </div>

    <div class="events">
      <div class="event">
        <div class="label">Cérémonie</div>
        <div class="place">${placeMarkup(EVENT.ceremony_place, EVENT.ceremony_map_url)}</div>
        <div class="sub">${EVENT.ceremony_time}</div>
      </div>
      <div class="event">
        <div class="label">Réception</div>
        <div class="place">${placeMarkup(EVENT.reception_place, EVENT.reception_map_url)}</div>
        <div class="sub">${EVENT.reception_time}</div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="rsvp">
      <h2>Serez-vous des nôtres ?</h2>
      <div class="deadline">${EVENT.deadline}</div>
      <div id="guestRows"></div>
      <div class="submit-row">
        <button class="submit-btn" id="submitBtn">Envoyer ma réponse</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>
  `;

  const draft = {};
  guests.forEach(g => { draft[g.id] = g.status; });

  function renderRows(){
    const rowsEl = document.getElementById('guestRows');
    rowsEl.innerHTML = '';
    guests.forEach(g => {
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-name">${g.member_name}</div>
        <div class="choice">
          <button class="pill attend ${draft[g.id]==='attending'?'active':''}">Je serai présent·e</button>
          <button class="pill decline ${draft[g.id]==='declined'?'active':''}">Je ne pourrai pas</button>
        </div>`;
      const [attendBtn, declineBtn] = row.querySelectorAll('.pill');
      attendBtn.onclick = () => { draft[g.id] = 'attending'; renderRows(); };
      declineBtn.onclick = () => { draft[g.id] = 'declined'; renderRows(); };
      rowsEl.appendChild(row);
    });
  }
  renderRows();

  document.getElementById('submitBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const allAnswered = guests.every(g => draft[g.id] === 'attending' || draft[g.id] === 'declined');
    if(!allAnswered){
      statusMsg.textContent = "Merci de répondre pour chaque invité avant d'envoyer.";
      statusMsg.className = 'status-msg error';
      return;
    }
    submitBtn.disabled = true;
    statusMsg.textContent = 'Enregistrement…';
    statusMsg.className = 'status-msg';

    try{
      for(const g of guests){
        const { error } = await sb.from('guests')
          .update({ status: draft[g.id], responded_at: new Date().toISOString() })
          .eq('id', g.id);
        if(error) throw error;
        g.status = draft[g.id];
      }
      statusMsg.textContent = 'Merci ! Votre réponse a bien été enregistrée.';
      statusMsg.className = 'status-msg';
    }catch(e){
      console.error(e);
      statusMsg.textContent = "Une erreur est survenue, merci de réessayer.";
      statusMsg.className = 'status-msg error';
    }
    submitBtn.disabled = false;
  };
}

async function init(){
  const slug = getSlug();
  if(!slug){
    cardInner.innerHTML = '<div class="error-box">Ce lien d\'invitation est incomplet.<br>Merci d\'utiliser le lien qui vous a été envoyé.</div>';
    return;
  }
  try{
    const { data: invite, error: inviteErr } = await sb.from('invites').select('*').eq('slug', slug).single();
    if(inviteErr || !invite) throw new Error('invite not found');

    const { data: guests, error: guestsErr } = await sb.from('guests').select('*').eq('invite_slug', slug).order('member_name');
    if(guestsErr) throw guestsErr;

    renderShell(invite, guests);
  }catch(e){
    console.error(e);
    cardInner.innerHTML = '<div class="error-box">Invitation introuvable.<br>Merci de vérifier votre lien.</div>';
  }
}

init();
</script>
