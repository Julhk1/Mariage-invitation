<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Julien & Vanessa — Invitation</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Julien & Vanessa — Wedding Invitation">
<meta property="og:description" content="You are warmly invited to celebrate our wedding on Sunday, November 1, 2026. Kindly confirm your attendance by October 15, 2026.">
<!-- Replace this image with an absolute URL to a couple photo for the richest WhatsApp/iMessage preview card. -->
<meta property="og:image" content="https://mariage-invitation-rho.vercel.app/royal-flourish-rings.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ivory:#faf6ec; --ivory-deep:#f1e9d6; --ivory-panel:#fffdf7;
    --green-1:#15301f; --green-2:#0a1e12; --green-3:#1e4029;
    --gold:#b8935b; --gold-deep:#93713f; --gold-light:#e6d3a8;
    --ink:#26291f; --ink-soft:#736a56;
    --line:#e1d3ac;
    --ok-text:#4f7a4a; --ok-bg:#eef2e7;
    --no-text:#8a4d3a; --no-bg:#f4e9df;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{overflow-x:hidden;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 18% 6%, rgba(184,147,91,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(21,48,31,0.06), transparent 50%),
      var(--ivory);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    padding:0;
    display:flex; flex-direction:column; align-items:center;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, rgba(184,147,91,0.035) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(-45deg, rgba(184,147,91,0.035) 0 1px, transparent 1px 30px);
  }

  /* =========================================================
     ENVELOPE INTRO
     ========================================================= */
  .envelope-screen{
    position:fixed; inset:0; z-index:50;
    background:var(--ivory);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:24px;
    transition:opacity 900ms cubic-bezier(.65,0,.35,1), visibility 900ms;
  }
  .envelope-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .envelope-btn{
    all:unset; cursor:pointer; display:block;
    width:min(300px,80vw); aspect-ratio:1.55/1;
    perspective:1200px;
  }
  .envelope{
    position:relative; width:100%; height:100%;
    background:var(--ivory-panel);
    border:1px solid var(--gold);
    box-shadow:0 24px 50px -24px rgba(10,30,18,0.35);
    overflow:visible;
  }
  .envelope::after{
    content:""; position:absolute; inset:6px; border:1px solid var(--gold-deep); opacity:.45; pointer-events:none;
  }
  .envelope-flap{
    position:absolute; top:0; left:0; right:0; height:60%;
    background:var(--green-1);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center; transform-style:preserve-3d; backface-visibility:hidden;
    transition:transform 950ms cubic-bezier(.65,0,.35,1);
    z-index:3;
  }
  .envelope.opening .envelope-flap{ transform:rotateX(180deg); }

  .seal{
    position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
    width:56px; height:56px; border-radius:50%; z-index:4;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold-deep) 72%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -6px rgba(10,30,18,0.45);
    transition:opacity 500ms ease, transform 500ms ease;
    animation:sealPulse 2.6s ease-in-out infinite;
  }
  .seal span{ font-family:'Parisienne', cursive; font-size:22px; color:var(--green-2); line-height:1; }
  .envelope.opening .seal{ opacity:0; transform:translate(-50%,-50%) scale(.5); animation:none; }
  @keyframes sealPulse{
    0%,100%{ box-shadow:0 8px 18px -6px rgba(10,30,18,0.45), 0 0 0 0 rgba(184,147,91,0.35); }
    50%{ box-shadow:0 8px 18px -6px rgba(10,30,18,0.45), 0 0 0 9px rgba(184,147,91,0); }
  }

  .tap-hint{
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--gold-deep); text-align:center;
    transition:opacity 500ms ease;
  }
  .envelope-screen.hide .tap-hint{ opacity:0; }

  /* =========================================================
     INVITATION SHELL
     ========================================================= */
  .page{ width:100%; display:flex; justify-content:center; padding:34px 14px 60px; position:relative; z-index:1; }
  .invitation{
    width:100%; max-width:500px;
    background:var(--ivory-panel);
    position:relative;
    box-shadow:0 40px 90px -40px rgba(10,30,18,0.35);
  }
  .invitation::before{ content:""; position:absolute; inset:0; border:1px solid var(--gold); opacity:.55; pointer-events:none; z-index:3; }

  .bracket{ position:absolute; width:22px; height:22px; z-index:4; pointer-events:none; }
  .bracket.tl{ top:12px; left:12px; border-top:1px solid var(--gold); border-left:1px solid var(--gold); }
  .bracket.tr{ top:12px; right:12px; border-top:1px solid var(--gold); border-right:1px solid var(--gold); }
  .bracket.bl{ bottom:12px; left:12px; border-bottom:1px solid var(--gold); border-left:1px solid var(--gold); }
  .bracket.br{ bottom:12px; right:12px; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }

  .watermark{
    position:absolute; top:46%; left:50%; transform:translate(-50%,-50%);
    width:58%; max-width:240px; opacity:0.10; z-index:1; pointer-events:none;
    object-fit:contain; filter:sepia(15%) saturate(90%);
  }

  .content{
    padding:clamp(48px,10vw,64px) clamp(26px,7vw,48px) clamp(46px,8vw,58px);
    text-align:center; position:relative; z-index:2;
  }

  /* hero entrance elements — hidden until envelope opens */
  .hero-el{ opacity:0; }
  body.revealed .hero-el{
    animation:riseIn 1200ms cubic-bezier(.19,1,.22,1) both;
    animation-delay:calc(var(--d,0) * 150ms);
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }

  .mono-badge{
    width:64px; height:64px; border-radius:50%; margin:0 auto 22px;
    border:1px solid var(--gold); display:flex; align-items:center; justify-content:center;
    background:var(--ivory-deep); position:relative;
  }
  .mono-badge::before{ content:""; position:absolute; inset:5px; border:1px solid var(--gold-deep); border-radius:50%; opacity:.5; }
  .mono-badge span{ font-family:'Parisienne', cursive; font-size:26px; color:var(--green-1); }

  .eyebrow{ font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:10px; }
  .parents-line{ font-family:'Parisienne', cursive; font-size:clamp(20px,5.5vw,25px); color:var(--green-1); margin-bottom:22px; line-height:1.3; }

  .invite-copy{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); line-height:2; max-width:320px; margin:0 auto 22px; }

  .names{ font-family:'Parisienne', cursive; font-size:clamp(44px,13vw,64px); line-height:1.15; margin-bottom:18px; color:var(--green-1); }
  .names .amp{ color:var(--gold); font-size:0.62em; margin:0 6px; }

  .presented-by{ font-size:14.5px; color:var(--ink-soft); font-style:italic; max-width:340px; margin:0 auto 6px; line-height:1.6; }

  .rule{ width:56px; height:1px; background:var(--gold); opacity:.55; margin:30px auto; position:relative; }
  .rule::before{ content:"§"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg); background:var(--ivory-panel); color:var(--gold-deep); font-size:12px; padding:0 10px; font-style:italic; }

  /* scroll reveal (post-load sections) */
  .reveal{ opacity:0; transform:translateY(26px); transition:opacity 1000ms cubic-bezier(.19,1,.22,1), transform 1000ms cubic-bezier(.19,1,.22,1); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  /* date staged like a printed insert card */
  .date-card{
    margin:8px auto 32px; max-width:250px; padding:20px 22px 22px;
    border:1px solid var(--gold); background:var(--ivory-deep);
    position:relative; transform:rotate(-0.6deg);
    box-shadow:0 18px 36px -22px rgba(10,30,18,0.40);
  }
  .date-card::before{ content:""; position:absolute; inset:5px; border:1px solid var(--gold-deep); opacity:.45; }
  .date-card .day{ font-size:11.5px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-deep); position:relative; z-index:1; }
  .date-card .big{ font-family:'Cormorant Garamond', serif; font-size:clamp(20px,5.5vw,25px); letter-spacing:0.05em; margin-top:8px; font-weight:600; color:var(--green-1); position:relative; z-index:1; }

  .events{ display:flex; justify-content:center; align-items:stretch; gap:0; margin-bottom:6px; width:100%; }
  .event{ flex:1 1 0; max-width:220px; padding:0 14px; margin:0 auto; display:flex; flex-direction:column; }
  .event + .event{ border-left:1px solid var(--line); }
  .event .label{ text-transform:uppercase; font-size:10.5px; letter-spacing:0.18em; color:var(--gold-deep); margin-bottom:8px; }
  .event .place{ font-size:16.5px; font-weight:600; line-height:1.35; color:var(--green-1); }
  .event .addr{ font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:3px; }
  .event .sub{ font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:4px; }

  .map-btn{
    display:inline-flex; align-items:center; gap:7px; align-self:center;
    font-family:inherit; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold-deep); background:transparent; border:1px solid var(--gold-deep);
    padding:9px 16px; cursor:pointer;
    text-decoration:none; transition:background 450ms ease, color 450ms ease, border-color 450ms ease;
  }
  .event .map-btn{ margin-top:14px; align-self:center; }
  .gift-section .map-btn{ margin-top:12px; }
  .map-btn:hover{ background:var(--green-1); color:var(--ivory); border-color:var(--green-1); }
  .map-btn svg{ width:12px; height:12px; flex-shrink:0; }

  .rsvp{ margin-top:8px; }
  .rsvp h2{ font-family:'Parisienne', cursive; font-weight:400; font-size:clamp(27px,7vw,33px); color:var(--green-1); }
  .rsvp .deadline{ font-style:italic; color:var(--ink-soft); font-size:14px; margin:4px 0 20px; }

  .guest-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 2px; border-bottom:1px solid var(--line); text-align:left; flex-wrap:wrap; }
  .guest-row:last-of-type{ border-bottom:none; }
  .guest-name{ font-size:17px; font-weight:600; flex:1 1 100%; color:var(--green-1); }

  .choice{ display:flex; gap:0; width:100%; border:1px solid var(--line); }
  .pill{
    font-family:inherit; font-weight:600; font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:13px 10px; border:none; border-right:1px solid var(--line);
    background:var(--ivory-panel); color:var(--ink-soft); cursor:pointer;
    transition:background 450ms ease, color 450ms ease; flex:1; min-height:46px;
  }
  .pill:last-child{ border-right:none; }
  .pill.attend.active{ background:var(--green-1); color:var(--ivory); }
  .pill.decline.active{ background:var(--ivory-deep); color:var(--no-text); }

  .submit-row{ margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .submit-btn{
    font-family:inherit; text-transform:uppercase; letter-spacing:0.22em;
    font-size:12px; font-weight:700; background:var(--green-1); color:var(--gold-light);
    border:1px solid var(--gold); padding:17px 10px; cursor:pointer;
    transition:background 500ms ease, box-shadow 500ms ease; width:100%; max-width:290px; min-height:48px;
  }
  .submit-btn:hover{ background:var(--green-2); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .submit-btn.needs-attention{ animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(184,147,91,0.35); }
    50%{ box-shadow:0 0 0 7px rgba(184,147,91,0); }
  }
  .unsaved-reminder{
    font-size:12px; font-weight:600; letter-spacing:0.03em; color:var(--gold-deep);
    background:var(--ivory-deep); border:1px solid var(--gold-light);
    padding:7px 16px; margin-bottom:2px;
    display:none; text-align:center;
  }
  .unsaved-reminder.show{ display:block; }
  .status-msg{ font-size:13.5px; color:var(--ok-text); font-style:italic; min-height:18px; }
  .status-msg.error{ color:var(--no-text); }

  /* gift registry */
  .gift-section{ margin-top:8px; }
  .gift-heading{ font-family:'Parisienne', cursive; font-weight:400; font-size:clamp(27px,7vw,33px); color:var(--green-1); }
  .gift-msg{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; max-width:340px; margin:12px auto 22px; }

  .acct-box{
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--ivory-deep); border:1px solid var(--line);
    padding:14px 18px; max-width:280px; margin:0 auto 18px;
  }
  .acct-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold-deep); display:block; margin-bottom:3px; }
  .acct-number{ font-size:18px; font-weight:700; letter-spacing:0.05em; color:var(--green-1); }
  .copy-btn{
    font-family:inherit; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    background:var(--green-1); color:var(--gold-light); border:none;
    padding:9px 15px; cursor:pointer; flex-shrink:0; transition:background 450ms ease;
  }
  .copy-btn:hover{ background:var(--green-2); }
  .copy-feedback{ font-size:12.5px; color:var(--ok-text); font-weight:600; min-height:16px; margin-bottom:8px; }

  .loading, .error-box{ color:var(--ink-soft); font-style:italic; padding:60px 20px; text-align:center; }

  @media (max-width:400px){
    .events{ flex-direction:column; gap:20px; }
    .event{ margin:0 auto; }
    .event + .event{ border-left:none; border-top:1px solid var(--line); padding-top:16px; }
  }
</style>
</head>
<body>

  <div class="envelope-screen" id="envelopeScreen">
    <button class="envelope-btn" id="envelopeBtn" aria-label="Open your invitation">
      <div class="envelope" id="envelopeEl">
        <div class="envelope-flap"></div>
        <div class="seal"><span>JV</span></div>
      </div>
    </button>
    <div class="tap-hint">Tap to open your invitation</div>
  </div>

  <div class="page">
    <div class="invitation">
      <span class="bracket tl"></span>
      <span class="bracket tr"></span>
      <span class="bracket bl"></span>
      <span class="bracket br"></span>

      <img class="watermark" src="royal-flourish-rings.png" alt="" />

      <div class="content" id="cardInner">
        <div class="loading">Loading your invitation…</div>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   1) CONFIGURATION — Supabase project keys
   ========================================================= */
const SUPABASE_URL = "https://dthppsntdwdtvqgwwbhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";

/* =========================================================
   2) EVENT CONTENT
   ========================================================= */
const EVENT = {
  monogram: 'JV',
  ceremony_map_url: 'https://maps.app.goo.gl/oxTBmFbUH9Ye2uDC8',
  reception_map_url: 'https://maps.app.goo.gl/496NayzXRB9XhyNa8',

  rsvp_deadline_iso: '2026-10-15T23:59:59',

  gift: {
    account_number: '123456789',
    whish_url: 'https://www.whish.money/locations'
  },

  en: {
    parents_line: 'Hobeika &amp; Fakhry',
    invite_copy: 'Have the pleasure of inviting you to the wedding of',
    names: 'Julien<span class="amp">&amp;</span>Vanessa',
    date_day: 'Sunday',
    date_big: 'November 1, 2026',
    ceremony_place: 'Église Maronite Saint-Élias',
    ceremony_addr: 'Fakhreddine Street, Kantari, Beirut',
    ceremony_time: '5:30 PM',
    reception_place: 'Country Lodge Club & Resort',
    reception_addr: 'Bsalim, North Metn',
    reception_time: '8:00 PM',
    deadline: 'Please confirm before October 15, 2026'
  }
};

const UI = {
  en: {
    ceremony_label: 'Ceremony',
    reception_label: 'Reception',
    location_btn: 'Location Map',
    families_label: 'The Families of',
    rsvp_heading: 'Will you be there?',
    attend_btn: "I'll be there",
    decline_btn: "I can't make it",
    submit_btn: 'Send my response',
    saving: 'Saving…',
    saved_ok: 'Thank you! Your response has been recorded.',
    need_all: 'Please answer for each guest before sending.',
    error_generic: 'Something went wrong, please try again.',
    unsaved_reminder: "Don't forget to press \"Send my response\" below ↓",
    leave_warning: 'Your response has not been sent yet. Are you sure you want to leave?',
    loading: 'Loading your invitation…',
    incomplete_link: "This invitation link is incomplete.<br>Please use the link that was sent to you.",
    not_found: 'Invitation not found.<br>Please check your link.',
    gift_heading: 'Gift Registry',
    gift_msg: 'Sharing our joy with you is what matters most. For those who wish, a gift may be sent via Whish Money.',
    account_label: 'Account Number',
    copy_btn: 'Copy',
    copied_msg: 'Copied to clipboard ✓',
    whish_btn: 'Whish Locations'
  }
};
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cardInner = document.getElementById('cardInner');

const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>';
const ICON_CHURCH = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v4M10 4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 6l9 6v10H3V12l9-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 22v-6h4v6" stroke="currentColor" stroke-width="1.6"/></svg>';

function getSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get('invite');
}

const currentLang = 'en';
let loadState = 'loading';
let cachedInvite = null;
let cachedGuests = null;
let draft = {};

/* =========================================================
   ENVELOPE INTRO
   ========================================================= */
function openEnvelope(){
  const screen = document.getElementById('envelopeScreen');
  const envelope = document.getElementById('envelopeEl');
  if(!screen || envelope.classList.contains('opening')) return;
  envelope.classList.add('opening');
  document.body.classList.add('revealed');
  setTimeout(() => { screen.classList.add('hide'); }, 550);
}
document.getElementById('envelopeBtn').addEventListener('click', openEnvelope);

/* =========================================================
   SCROLL REVEAL
   ========================================================= */
function initScrollReveal(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(el => el.classList.add('in-view'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  els.forEach(el => io.observe(el));
}

function paint(){
  const t = UI[currentLang];
  if(loadState === 'loading'){ cardInner.innerHTML = `<div class="loading">${t.loading}</div>`; return; }
  if(loadState === 'empty-slug'){ cardInner.innerHTML = `<div class="error-box">${t.incomplete_link}</div>`; return; }
  if(loadState === 'not-found'){ cardInner.innerHTML = `<div class="error-box">${t.not_found}</div>`; return; }
  renderShell(cachedInvite, cachedGuests);
}

function renderShell(invite, guests){
  const t = UI[currentLang];
  const e = EVENT[currentLang];

  cardInner.innerHTML = `
    <div class="mono-badge hero-el" style="--d:0"><span>${EVENT.monogram}</span></div>

    ${e.parents_line ? `
      <div class="eyebrow hero-el" style="--d:1">${t.families_label}</div>
      <div class="parents-line hero-el" style="--d:1">${e.parents_line}</div>
    ` : ``}

    <div class="invite-copy hero-el" style="--d:2">${e.invite_copy}</div>

    <div class="names hero-el" style="--d:3">${e.names}</div>
    <p class="presented-by hero-el" style="--d:4">${invite.note || ''}</p>

    <div class="rule"></div>

    <div class="date-card reveal">
      <div class="day">${e.date_day}</div>
      <div class="big">${e.date_big}</div>
    </div>

    <div class="events reveal">
      <div class="event">
        <div class="label">${t.ceremony_label}</div>
        <div class="place">${e.ceremony_place}</div>
        <div class="addr">${e.ceremony_addr}</div>
        <div class="sub">${e.ceremony_time}</div>
        <a class="map-btn" href="${EVENT.ceremony_map_url}" target="_blank" rel="noopener">${ICON_CHURCH}${t.location_btn}</a>
      </div>
      <div class="event">
        <div class="label">${t.reception_label}</div>
        <div class="place">${e.reception_place}</div>
        <div class="addr">${e.reception_addr}</div>
        <div class="sub">${e.reception_time}</div>
        <a class="map-btn" href="${EVENT.reception_map_url}" target="_blank" rel="noopener">${ICON_PIN}${t.location_btn}</a>
      </div>
    </div>

    <div class="rule"></div>

    <div class="rsvp reveal">
      <h2>${t.rsvp_heading}</h2>
      <div class="deadline">${e.deadline}</div>
      <div id="guestRows"></div>
      <div class="submit-row">
        <div class="unsaved-reminder" id="unsavedReminder"></div>
        <button class="submit-btn" id="submitBtn">${t.submit_btn}</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="gift-section reveal">
      <div class="gift-heading">${t.gift_heading}</div>
      <p class="gift-msg">${t.gift_msg}</p>
      <div class="copy-feedback" id="copyFeedback"></div>
      <div class="acct-box">
        <div>
          <span class="acct-label">${t.account_label}</span>
          <span class="acct-number">${EVENT.gift.account_number}</span>
        </div>
        <button class="copy-btn" id="copyBtn">${t.copy_btn}</button>
      </div>
      <a class="map-btn" href="${EVENT.gift.whish_url}" target="_blank" rel="noopener">${ICON_PIN}${t.whish_btn}</a>
    </div>
  `;

  requestAnimationFrame(initScrollReveal);

  document.getElementById('copyBtn').onclick = async () => {
    const fb = document.getElementById('copyFeedback');
    try{
      await navigator.clipboard.writeText(EVENT.gift.account_number);
    }catch(err){
      const tmp = document.createElement('input');
      tmp.value = EVENT.gift.account_number;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    }
    fb.textContent = t.copied_msg;
    setTimeout(() => { fb.textContent = ''; }, 1800);
  };

  function hasUnsavedChanges(){
    return guests.some(g => draft[g.id] && draft[g.id] !== g.status);
  }

  function updateReminderState(){
    const reminderEl = document.getElementById('unsavedReminder');
    const submitBtn = document.getElementById('submitBtn');
    if(!reminderEl || !submitBtn) return;
    const unsaved = hasUnsavedChanges();
    reminderEl.textContent = t.unsaved_reminder;
    reminderEl.classList.toggle('show', unsaved);
    submitBtn.classList.toggle('needs-attention', unsaved);
  }

  function renderRows(){
    const rowsEl = document.getElementById('guestRows');
    rowsEl.innerHTML = '';
    guests.forEach(g => {
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-name">${g.member_name}</div>
        <div class="choice">
          <button class="pill attend ${draft[g.id]==='attending'?'active':''}">${t.attend_btn}</button>
          <button class="pill decline ${draft[g.id]==='declined'?'active':''}">${t.decline_btn}</button>
        </div>`;
      const [attendBtn, declineBtn] = row.querySelectorAll('.pill');
      attendBtn.onclick = () => { draft[g.id] = 'attending'; renderRows(); };
      declineBtn.onclick = () => { draft[g.id] = 'declined'; renderRows(); };
      rowsEl.appendChild(row);
    });
    updateReminderState();
  }
  renderRows();

  document.getElementById('submitBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const allAnswered = guests.every(g => draft[g.id] === 'attending' || draft[g.id] === 'declined');
    if(!allAnswered){
      statusMsg.textContent = t.need_all;
      statusMsg.className = 'status-msg error';
      return;
    }
    submitBtn.disabled = true;
    statusMsg.textContent = t.saving;
    statusMsg.className = 'status-msg';
    try{
      for(const g of guests){
        const { error } = await sb.from('guests')
          .update({ status: draft[g.id], responded_at: new Date().toISOString() })
          .eq('id', g.id);
        if(error) throw error;
        g.status = draft[g.id];
      }
      statusMsg.textContent = t.saved_ok;
      statusMsg.className = 'status-msg';
      updateReminderState();
    }catch(err){
      console.error(err);
      statusMsg.textContent = t.error_generic;
      statusMsg.className = 'status-msg error';
    }
    submitBtn.disabled = false;
  };
}

window.addEventListener('beforeunload', (e) => {
  if(loadState !== 'ready' || !cachedGuests) return;
  const unsaved = cachedGuests.some(g => draft[g.id] && draft[g.id] !== g.status);
  if(unsaved){
    e.preventDefault();
    e.returnValue = '';
  }
});

async function init(){
  const slug = getSlug();
  if(!slug){ loadState = 'empty-slug'; paint(); return; }
  try{
    const { data: invite, error: inviteErr } = await sb.from('invites').select('*').eq('slug', slug).single();
    if(inviteErr || !invite) throw new Error('invite not found');
    const { data: guests, error: guestsErr } = await sb.from('guests').select('*').eq('invite_slug', slug);
    if(guestsErr) throw guestsErr;

    cachedInvite = invite;
    cachedGuests = guests;
    guests.forEach(g => { draft[g.id] = g.status; });
    loadState = 'ready';
    paint();
  }catch(e){
    console.error(e);
    loadState = 'not-found';
    paint();
  }
}

init();
</script>
</body>
</html>
