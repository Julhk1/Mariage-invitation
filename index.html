<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Julien & Vanessa — Invitation</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Julien & Vanessa — Wedding Invitation">
<meta property="og:description" content="You are warmly invited to celebrate our wedding on Sunday, November 1, 2026. Kindly confirm your attendance by October 15, 2026.">
<meta property="og:image" content="https://mariage-invitation-rho.vercel.app/envelope-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    /* -- Royal Sapphire & Gold -- */
    --navy-1:#0e1c3f; --navy-2:#050a1c; --navy-3:#16264f;
    --paper:#faf5e8; --paper-edge:#f0e6cd;
    --ink:#241d12; --ink-soft:#786b52;
    --gold:#caa653; --gold-deep:#8f6f28; --gold-light:#f2dda0; --line:#e4d6ac;
    --ok-bg:#e9f1e6; --ok-text:#4c6f45;
    --no-bg:#f4e6de; --no-text:#8a4a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{overflow-x:hidden;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(202,166,83,0.14), transparent 55%),
      radial-gradient(circle at 88% 92%, rgba(30,58,120,0.35), transparent 50%),
      radial-gradient(rgba(202,166,83,0.30) 1px, transparent 1.5px) 0 0/44px 44px,
      linear-gradient(165deg, var(--navy-1) 0%, var(--navy-2) 60%, #030510 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    padding:22px 12px 50px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* =========================================================
     SEAL INTRO — royal wax seal on midnight velvet
     ========================================================= */
  .envelope-screen{
    position:fixed; inset:0; z-index:50;
    background:
      radial-gradient(circle at 50% 40%, rgba(202,166,83,0.16), transparent 58%),
      radial-gradient(circle, transparent 0 32px, rgba(202,166,83,0.10) 32px 33px, transparent 33px 100%) 23px 20px/46px 46px,
      radial-gradient(circle, transparent 0 32px, rgba(202,166,83,0.10) 32px 33px, transparent 33px 100%) 0 0/46px 46px,
      radial-gradient(circle at 50% 45%, #16264f, #050a1c 72%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px;
    transition:opacity 900ms cubic-bezier(.65,0,.35,1), visibility 900ms;
  }
  .envelope-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .crown-mark{ width:34px; height:auto; opacity:0.92; }

  .envelope-btn{
    all:unset; cursor:pointer; display:block;
    width:min(230px,62vw); aspect-ratio:1/1;
  }
  .envelope{
    position:relative; width:100%; height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #e6cd8c, #a9803a 55%, #6f501f 100%);
    box-shadow:
      0 0 0 1px rgba(242,221,160,0.5),
      0 0 0 7px rgba(202,166,83,0.10),
      0 22px 50px -14px rgba(0,0,0,0.75),
      inset 0 2px 3px rgba(255,255,255,0.55),
      inset 0 -8px 14px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform 700ms cubic-bezier(.65,0,.35,1), opacity 700ms ease, box-shadow 700ms ease;
    animation:sealPulse 2.8s ease-in-out infinite;
  }
  .envelope::before{
    content:"";
    position:absolute; inset:10px; border-radius:50%;
    border:1px solid rgba(111,80,31,0.55);
  }
  .envelope::after{
    content:"";
    position:absolute; inset:-40%;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.45) 50%, transparent 58%);
    animation:sealShine 4.5s ease-in-out infinite;
  }
  @keyframes sealShine{
    0%, 30%{ transform:translateX(-55%) translateY(-55%); }
    60%, 100%{ transform:translateX(55%) translateY(55%); }
  }
  @keyframes sealPulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(242,221,160,0.5), 0 0 0 7px rgba(202,166,83,0.10), 0 22px 50px -14px rgba(0,0,0,0.75), inset 0 2px 3px rgba(255,255,255,0.55), inset 0 -8px 14px rgba(0,0,0,0.35), 0 0 0 0 rgba(202,166,83,0.35); }
    50%{ box-shadow:0 0 0 1px rgba(242,221,160,0.5), 0 0 0 7px rgba(202,166,83,0.10), 0 22px 50px -14px rgba(0,0,0,0.75), inset 0 2px 3px rgba(255,255,255,0.55), inset 0 -8px 14px rgba(0,0,0,0.35), 0 0 0 14px rgba(202,166,83,0); }
  }
  .envelope .seal-mono{ font-family:'Parisienne', cursive; font-size:44px; color:#4a350f; line-height:1; position:relative; z-index:1; text-shadow:0 1px 0 rgba(255,255,255,0.3); }
  .envelope.opening{ transform:scale(1.06) rotate(6deg); opacity:0; animation:none; }
  .envelope.opening::after{ animation:none; }

  .tap-hint{
    font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--gold-light); text-align:center;
    transition:opacity 500ms ease;
  }
  .envelope-screen.hide .tap-hint,
  .envelope-screen.hide .crown-mark{ opacity:0; }

  .card{
    width:100%; max-width:480px;
    background:var(--paper);
    border-radius:2px;
    box-shadow:
      0 45px 90px -26px rgba(0,0,0,0.65),
      0 18px 44px -20px rgba(5,10,28,0.45),
      0 0 0 1px rgba(202,166,83,0.35);
    overflow:hidden; position:relative; z-index:1;
  }
  .frame-outer{ position:absolute; inset:9px; border:2px solid var(--gold); pointer-events:none; z-index:3; }
  .frame-inner{ position:absolute; inset:14px; border:1px solid var(--gold-deep); pointer-events:none; z-index:3; opacity:0.55; }

  .corner{ position:absolute; width:42px; height:42px; z-index:3; pointer-events:none; }
  .corner.tl{ top:6px; left:6px; }
  .corner.tr{ top:6px; right:6px; transform:scaleX(-1); }
  .corner.bl{ bottom:6px; left:6px; transform:scaleY(-1); }
  .corner.br{ bottom:6px; right:6px; transform:scale(-1,-1); }

  .watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:58%; max-width:250px; opacity:0.12; z-index:1; pointer-events:none;
    object-fit:contain;
  }

  .crest{ width:46px; height:auto; margin:26px auto 4px; display:block; position:relative; z-index:2; }

  .card-inner{
    padding:clamp(10px,4vw,16px) clamp(22px,6vw,42px) clamp(34px,7vw,46px);
    text-align:center; position:relative; z-index:2;
  }

  .monogram{ font-family:'Parisienne', cursive; font-size:clamp(34px,9vw,44px); color:var(--gold-deep); margin-bottom:18px; }

  .eyebrow{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:0.34em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:10px; }
  .parents-line{ font-family:'Parisienne', cursive; font-size:clamp(21px,5.5vw,26px); color:var(--ink); margin-bottom:20px; line-height:1.3; }

  .invite-copy{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); line-height:2; max-width:320px; margin:0 auto 24px; }

  .names{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:clamp(44px,13vw,62px); line-height:1.3; margin-bottom:18px;
    padding-top:0.12em;
    background:linear-gradient(115deg, var(--gold-deep) 15%, var(--gold-light) 40%, var(--gold) 55%, var(--gold-deep) 80%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--gold-deep);
  }
  .names .amp{ font-family:'Parisienne', cursive; font-style:normal; font-size:0.6em; margin:0 6px; color:var(--gold); -webkit-text-fill-color:var(--gold); opacity:0.9; }

  .presented-by{ font-size:14.5px; color:var(--ink-soft); font-style:italic; max-width:340px; margin:0 auto 22px; line-height:1.55; }

  .rule{ width:70px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:22px auto; position:relative; }
  .rule::before{ content:"✦"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--paper); color:var(--gold-deep); font-size:12px; padding:0 10px; }
  .floral-header{ width:min(230px,72%); height:auto; margin:30px auto 6px; display:block; position:relative; z-index:2; }

  .date-block{ margin:6px 0 26px; position:relative; }
  .date-block .day{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-deep); }
  .date-block .big{
    font-size:clamp(19px,5.2vw,25px); letter-spacing:0.08em; margin-top:9px; font-weight:600; color:var(--ink);
    display:inline-block; padding:0 8px; position:relative;
  }
  .date-block .big::before, .date-block .big::after{
    content:""; position:absolute; top:50%; width:24px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold));
  }
  .date-block .big::before{ left:-28px; }
  .date-block .big::after{ right:-28px; transform:scaleX(-1); }

  .events{ display:flex; justify-content:center; align-items:stretch; gap:0; margin-bottom:4px; width:100%; }
  .event{ flex:1 1 0; max-width:210px; padding:0 14px; margin:0 auto; display:flex; flex-direction:column; }
  .event + .event{ border-left:1px solid var(--line); }
  .event .label{ font-family:'Cinzel', serif; text-transform:uppercase; font-size:10px; letter-spacing:0.2em; color:var(--gold-deep); margin-bottom:7px; }
  .event .place{ font-size:16.5px; font-weight:600; line-height:1.3; }
  .event .addr{ font-size:12px; color:var(--ink-soft); line-height:1.4; margin-top:2px; }
  .event .sub{ font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:3px; }

  .map-btn{
    display:inline-flex; align-items:center; gap:6px; align-self:center;
    font-family:'Cinzel', serif; font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--gold-deep); background:transparent; border:1px solid var(--gold-deep);
    border-radius:2px; padding:9px 14px; cursor:pointer;
    text-decoration:none; transition:background .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  }
  .event .map-btn{ margin-top:auto; align-self:center; padding-top:9px; }
  .gift-section .map-btn{ margin-top:12px; }
  .map-btn:hover{ background:var(--navy-1); color:var(--gold-light); border-color:var(--navy-1); box-shadow:0 8px 18px -8px rgba(14,28,63,0.55); transform:translateY(-1px); }
  .map-btn svg{ width:12px; height:12px; flex-shrink:0; }

  .rsvp{ margin-top:34px; }
  .rsvp h2{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600; font-size:clamp(25px,6.5vw,30px); color:var(--navy-1); }
  .rsvp .deadline{ font-style:italic; color:var(--ink-soft); font-size:14px; margin:3px 0 18px; }

  .guest-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); text-align:left; flex-wrap:wrap; }
  .guest-row:last-of-type{ border-bottom:none; }
  .guest-name{ font-size:17px; font-weight:600; flex:1 1 100%; }

  .choice{ display:flex; gap:8px; width:100%; }
  .pill{
    font-family:inherit; font-weight:600; font-size:13.5px;
    padding:11px 10px; border-radius:2px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer;
    transition:all .15s ease; flex:1; min-height:44px;
  }
  .pill:active{ transform:scale(0.97); }
  .pill.attend.active{ background:var(--ok-bg); border-color:var(--ok-text); color:var(--ok-text); box-shadow:0 4px 12px -6px rgba(76,111,69,0.5); }
  .pill.decline.active{ background:var(--no-bg); border-color:var(--no-text); color:var(--no-text); box-shadow:0 4px 12px -6px rgba(138,74,58,0.5); }

  .submit-row{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .submit-btn{
    font-family:'Cinzel', serif; text-transform:uppercase; letter-spacing:0.18em;
    font-size:12px; font-weight:600; color:var(--gold-light);
    background:linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 100%);
    border:1px solid var(--gold); padding:16px 10px; border-radius:2px; cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(5,10,28,0.7), inset 0 1px 0 rgba(202,166,83,0.18);
    transition:background .25s ease, box-shadow .25s ease, transform .15s ease;
    width:100%; max-width:280px; min-height:48px;
  }
  .submit-btn:hover{ background:linear-gradient(160deg, var(--navy-3) 0%, var(--navy-2) 100%); box-shadow:0 14px 30px -12px rgba(5,10,28,0.8), inset 0 1px 0 rgba(202,166,83,0.25); }
  .submit-btn:active{ transform:translateY(1px); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .submit-btn.needs-attention{ animation: pulse-glow 1.6s ease-in-out infinite; }
  @keyframes pulse-glow{
    0%, 100% { box-shadow:0 0 0 0 rgba(202,166,83,0.55); }
    50% { box-shadow:0 0 0 8px rgba(202,166,83,0); }
  }
  .unsaved-reminder{
    font-size:12.5px; font-weight:600; color:var(--gold-deep);
    background:var(--paper-edge); border:1px solid var(--gold-light);
    border-radius:20px; padding:6px 14px; margin-bottom:4px;
    display:none; text-align:center;
  }
  .unsaved-reminder.show{ display:block; }
  .status-msg{ font-size:13.5px; color:var(--ok-text); font-style:italic; min-height:18px; }
  .status-msg.error{ color:var(--no-text); }

  /* gift registry */
  .gift-section{ margin-top:34px; }
  .gift-heading{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600; font-size:clamp(25px,6.5vw,30px); color:var(--navy-1); }
  .gift-msg{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; max-width:340px; margin:10px auto 20px; }

  .acct-box{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--paper-edge); border:1px solid var(--line); border-radius:2px;
    padding:12px 16px; max-width:280px; margin:0 auto 16px;
  }
  .acct-label{ font-family:'Cinzel', serif; font-size:9.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold-deep); display:block; margin-bottom:3px; }
  .acct-number{ font-size:18px; font-weight:700; letter-spacing:0.04em; }
  .copy-btn{
    font-family:'Cinzel', serif; font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--navy-1); color:var(--gold-light); border:none;
    border-radius:2px; padding:9px 14px; cursor:pointer; flex-shrink:0; transition:background .15s ease;
  }
  .copy-btn:hover{ background:var(--navy-3); }
  .copy-feedback{ font-size:12.5px; color:var(--ok-text); font-weight:600; min-height:16px; margin-bottom:6px; }

  .loading, .error-box{ color:var(--ink-soft); font-style:italic; padding:48px 20px; text-align:center; }

  @media (max-width:400px){
    .events{ flex-direction:column; gap:16px; }
    .event{ margin:0 auto; }
    .event + .event{ border-left:none; border-top:1px solid var(--line); padding-top:14px; }
  }
</style>
</head>
<body>

  <div class="envelope-screen" id="envelopeScreen">

<script>
/* =========================================================
   1) CONFIGURATION — Supabase project keys
   ========================================================= */
const SUPABASE_URL = "https://dthppsntdwdtvqgwwbhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";

/* =========================================================
   2) EVENT CONTENT — one block per language.
   ========================================================= */
const EVENT = {
  monogram: 'JV',
  ceremony_map_url: 'https://maps.app.goo.gl/oxTBmFbUH9Ye2uDC8',
  reception_map_url: 'https://maps.app.goo.gl/496NayzXRB9XhyNa8',

  rsvp_deadline_iso: '2026-10-15T23:59:59',

  gift: {
    account_number: '123456789',
    whish_url: 'https://www.whish.money/locations'
  },

  en: {
    parents_line: 'Hobeika &amp; Fakhry',
    invite_copy: 'Have the pleasure of inviting you to the wedding of',
    names: 'Julien<span class="amp">&amp;</span>Vanessa',
    date_day: 'Sunday',
    date_big: 'November 1, 2026',
    ceremony_place: 'Église Maronite Saint-Élias',
    ceremony_addr: 'Fakhreddine Street, Kantari, Beirut',
    ceremony_time: '5:30 PM',
    reception_place: 'Country Lodge Club & Resort',
    reception_addr: 'Bsalim, North Metn',
    reception_time: '8:00 PM',
    deadline: 'Please confirm before October 15, 2026'
  }
};

const UI = {
  en: {
    ceremony_label: 'Ceremony',
    reception_label: 'Reception',
    location_btn: 'Location Map',
    families_label: 'The Families of',
    rsvp_heading: 'Will you be there?',
    countdown_lead: 'Time left to respond',
    days: 'Days', hours: 'Hours', mins: 'Min', secs: 'Sec',
    attend_btn: "I'll be there",
    decline_btn: "I can't make it",
    submit_btn: 'Send my response',
    saving: 'Saving…',
    saved_ok: 'Thank you! Your response has been recorded.',
    need_all: 'Please answer for each guest before sending.',
    error_generic: 'Something went wrong, please try again.',
    unsaved_reminder: "Don't forget to press \"Send my response\" below ↓",
    leave_warning: 'Your response has not been sent yet. Are you sure you want to leave?',
    loading: 'Loading your invitation…',
    incomplete_link: "This invitation link is incomplete.<br>Please use the link that was sent to you.",
    not_found: 'Invitation not found.<br>Please check your link.',
    gift_heading: 'Gift Registry',
    gift_msg: 'Sharing our joy with you is what matters most. For those who wish, a gift may be sent via Whish Money.',
    account_label: 'Account Number',
    copy_btn: 'Copy',
    copied_msg: 'Copied to clipboard ✓',
    whish_btn: 'Whish Locations'
  }
};
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cardInner = document.getElementById('cardInner');

function openEnvelope(){
  const screen = document.getElementById('envelopeScreen');
  const envelope = document.getElementById('envelopeEl');
  if(!screen || envelope.classList.contains('opening')) return;
  envelope.classList.add('opening');
  setTimeout(() => { screen.classList.add('hide'); }, 550);
}
document.getElementById('envelopeBtn').addEventListener('click', openEnvelope);

const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>';
const ICON_CHURCH = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v4M10 4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 6l9 6v10H3V12l9-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 22v-6h4v6" stroke="currentColor" stroke-width="1.6"/></svg>';

function getSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get('invite');
}

const currentLang = 'en';
let loadState = 'loading';
let cachedInvite = null;
let cachedGuests = null;
let draft = {};

function paint(){
  const t = UI[currentLang];
  if(loadState === 'loading'){ cardInner.innerHTML = `<div class="loading">${t.loading}</div>`; return; }
  if(loadState === 'empty-slug'){ cardInner.innerHTML = `<div class="error-box">${t.incomplete_link}</div>`; return; }
  if(loadState === 'not-found'){ cardInner.innerHTML = `<div class="error-box">${t.not_found}</div>`; return; }
  renderShell(cachedInvite, cachedGuests);
}

function renderShell(invite, guests){
  const t = UI[currentLang];
  const e = EVENT[currentLang];

  cardInner.innerHTML = `
    ${e.parents_line ? `
      <div class="eyebrow">${t.families_label}</div>
      <div class="parents-line">${e.parents_line}</div>
    ` : `<div class="monogram">${EVENT.monogram}</div>`}

    <div class="invite-copy">${e.invite_copy}</div>

    <div class="names">${e.names}</div>
    <p class="presented-by">${invite.note || ''}</p>

    <div class="rule"></div>

    <div class="date-block">
      <div class="day">${e.date_day}</div>
      <div class="big">${e.date_big}</div>
    </div>

    <div class="events">
      <div class="event">
        <div class="label">${t.ceremony_label}</div>
        <div class="place">${e.ceremony_place}</div>
        <div class="addr">${e.ceremony_addr}</div>
        <div class="sub">${e.ceremony_time}</div>
        <a class="map-btn" href="${EVENT.ceremony_map_url}" target="_blank" rel="noopener">${ICON_CHURCH}${t.location_btn}</a>
      </div>
      <div class="event">
        <div class="label">${t.reception_label}</div>
        <div class="place">${e.reception_place}</div>
        <div class="addr">${e.reception_addr}</div>
        <div class="sub">${e.reception_time}</div>
        <a class="map-btn" href="${EVENT.reception_map_url}" target="_blank" rel="noopener">${ICON_PIN}${t.location_btn}</a>
      </div>
    </div>

    <div class="rule"></div>

    <div class="rsvp">
      <h2>${t.rsvp_heading}</h2>
      <div class="deadline">${e.deadline}</div>
      <div id="guestRows"></div>
      <div class="submit-row">
        <div class="unsaved-reminder" id="unsavedReminder"></div>
        <button class="submit-btn" id="submitBtn">${t.submit_btn}</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="gift-section">
      <div class="gift-heading">${t.gift_heading}</div>
      <p class="gift-msg">${t.gift_msg}</p>
      <div class="copy-feedback" id="copyFeedback"></div>
      <div class="acct-box">
        <div>
          <span class="acct-label">${t.account_label}</span>
          <span class="acct-number">${EVENT.gift.account_number}</span>
        </div>
        <button class="copy-btn" id="copyBtn">${t.copy_btn}</button>
      </div>
      <a class="map-btn" href="${EVENT.gift.whish_url}" target="_blank" rel="noopener">${ICON_PIN}${t.whish_btn}</a>
    </div>
  `;

  document.getElementById('copyBtn').onclick = async () => {
    const fb = document.getElementById('copyFeedback');
    try{
      await navigator.clipboard.writeText(EVENT.gift.account_number);
    }catch(err){
      const tmp = document.createElement('input');
      tmp.value = EVENT.gift.account_number;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    }
    fb.textContent = t.copied_msg;
    setTimeout(() => { fb.textContent = ''; }, 1800);
  };

  function hasUnsavedChanges(){
    return guests.some(g => draft[g.id] && draft[g.id] !== g.status);
  }

  function updateReminderState(){
    const reminderEl = document.getElementById('unsavedReminder');
    const submitBtn = document.getElementById('submitBtn');
    if(!reminderEl || !submitBtn) return;
    const unsaved = hasUnsavedChanges();
    reminderEl.textContent = t.unsaved_reminder;
    reminderEl.classList.toggle('show', unsaved);
    submitBtn.classList.toggle('needs-attention', unsaved);
  }

  function renderRows(){
    const rowsEl = document.getElementById('guestRows');
    rowsEl.innerHTML = '';
    guests.forEach(g => {
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-name">${g.member_name}</div>
        <div class="choice">
          <button class="pill attend ${draft[g.id]==='attending'?'active':''}">${t.attend_btn}</button>
          <button class="pill decline ${draft[g.id]==='declined'?'active':''}">${t.decline_btn}</button>
        </div>`;
      const [attendBtn, declineBtn] = row.querySelectorAll('.pill');
      attendBtn.onclick = () => { draft[g.id] = 'attending'; renderRows(); };
      declineBtn.onclick = () => { draft[g.id] = 'declined'; renderRows(); };
      rowsEl.appendChild(row);
    });
    updateReminderState();
  }
  renderRows();

  document.getElementById('submitBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const allAnswered = guests.every(g => draft[g.id] === 'attending' || draft[g.id] === 'declined');
    if(!allAnswered){
      statusMsg.textContent = t.need_all;
      statusMsg.className = 'status-msg error';
      return;
    }
    submitBtn.disabled = true;
    statusMsg.textContent = t.saving;
    statusMsg.className = 'status-msg';
    try{
      for(const g of guests){
        const { error } = await sb.from('guests')
          .update({ status: draft[g.id], responded_at: new Date().toISOString() })
          .eq('id', g.id);
        if(error) throw error;
        g.status = draft[g.id];
      }
      statusMsg.textContent = t.saved_ok;
      statusMsg.className = 'status-msg';
      updateReminderState();
    }catch(err){
      console.error(err);
      statusMsg.textContent = t.error_generic;
      statusMsg.className = 'status-msg error';
    }
    submitBtn.disabled = false;
  };
}

window.addEventListener('beforeunload', (e) => {
  if(loadState !== 'ready' || !cachedGuests) return;
  const unsaved = cachedGuests.some(g => draft[g.id] && draft[g.id] !== g.status);
  if(unsaved){
    e.preventDefault();
    e.returnValue = '';
  }
});

async function init(){
  const slug = getSlug();
  if(!slug){ loadState = 'empty-slug'; paint(); return; }
  try{
    const { data: invite, error: inviteErr } = await sb.from('invites').select('*').eq('slug', slug).single();
    if(inviteErr || !invite) throw new Error('invite not found');
    const { data: guests, error: guestsErr } = await sb.from('guests').select('*').eq('invite_slug', slug);
    if(guestsErr) throw guestsErr;

    cachedInvite = invite;
    cachedGuests = guests;
    guests.forEach(g => { draft[g.id] = g.status; });
    loadState = 'ready';
    paint();
  }catch(e){
    console.error(e);
    loadState = 'not-found';
    paint();
  }
}

init();
</script>
</body>
</html>
