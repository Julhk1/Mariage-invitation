<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap');
:root{
  --forest:#173b32;--forest-deep:#0e2923;--forest-soft:#244c41;
  --ivory:#fbf7ef;--ivory-2:#f5efe3;--ink:#26352f;--muted:#7b8178;
  --gold:#b9965a;--gold-light:#dcc79b;--line:#dfd3bb;
  --rose:#b88778;--ok:#55775d;--ok-bg:#e9f0e7;--no:#9a5a55;--no-bg:#f4e5e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}body{overflow-x:hidden;min-height:100vh;background:radial-gradient(circle at 50% -10%,#355f51 0,#173b32 38%,#0d241f 100%);font-family:'Cormorant Garamond',serif;color:var(--ink);padding:18px 12px 60px;display:flex;justify-content:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.12) .6px,transparent .6px);background-size:7px 7px}
.card{width:100%;max-width:500px;background:var(--ivory);position:relative;overflow:hidden;box-shadow:0 35px 90px rgba(0,0,0,.42);border:1px solid rgba(220,199,155,.65)}
.card:before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);pointer-events:none;z-index:10}.card:after{content:"";position:absolute;inset:14px;border:1px solid rgba(185,150,90,.45);pointer-events:none;z-index:10}
.card-inner{padding:30px 34px 48px;text-align:center;position:relative;z-index:2}
.watermark{position:absolute;width:230px;left:50%;top:390px;transform:translateX(-50%);opacity:.055;z-index:0;filter:sepia(1)}
.floral-header{width:210px;margin:0 auto 12px;opacity:.82}.eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:8px 0 12px}.parents-line{font-family:'Parisienne',cursive;font-size:27px;color:var(--forest);margin-bottom:24px}.invite-copy{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);line-height:1.8;max-width:310px;margin:0 auto 10px}
.names{font-family:'Parisienne',cursive;font-size:clamp(50px,14vw,68px);line-height:1.05;color:var(--forest);margin:4px auto 12px}.names .amp{color:var(--gold);font-size:.68em;margin:0 5px}.presented-by{font-size:15px;color:var(--muted);font-style:italic;line-height:1.55;max-width:350px;margin:0 auto}
.rule{width:92px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:25px auto;position:relative}.rule:after{content:'✦';position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:10px;color:var(--gold);background:var(--ivory);padding:0 9px}
.date-block{margin:2px 0 28px;padding:18px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.date-block .day{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.date-block .big{font-size:25px;letter-spacing:.08em;font-weight:600;color:var(--forest)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 auto;width:100%;position:relative}.event{padding:4px 16px 2px;display:flex;flex-direction:column;min-height:185px}.event+.event{border-left:1px solid var(--line)}.event .label{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);margin-bottom:9px}.event .place{font-size:18px;font-weight:600;line-height:1.25;color:var(--forest)}.event .addr{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px}.event .sub{font-size:15px;color:var(--rose);font-style:italic;margin-top:5px}.map-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;align-self:center;margin-top:auto;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--forest);background:transparent;border:1px solid var(--gold);border-radius:0;padding:8px 13px;text-decoration:none;transition:.2s}.map-btn:hover{background:var(--forest);color:var(--ivory)}.map-btn svg{width:12px;height:12px}
.rsvp{margin-top:8px}.rsvp h2,.gift-heading{font-family:'Parisienne',cursive;font-weight:400;font-size:35px;color:var(--forest)}.rsvp .deadline{font-size:14px;color:var(--muted);font-style:italic;margin:3px 0 22px}.guest-row{text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}.guest-name{font-size:18px;font-weight:600;color:var(--forest);margin-bottom:10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{font-family:inherit;font-weight:600;font-size:14px;padding:11px 8px;border-radius:0;border:1px solid var(--line);background:var(--ivory);color:var(--muted);cursor:pointer;transition:.18s;min-height:44px}.pill:hover{border-color:var(--gold)}.pill.attend.active{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.pill.decline.active{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.submit-row{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px}.submit-btn{font-family:inherit;text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700;background:var(--forest);color:var(--gold-light);border:1px solid var(--gold);padding:15px 16px;cursor:pointer;transition:.2s;width:100%;max-width:310px;min-height:50px}.submit-btn:hover{background:var(--forest-soft)}.submit-btn:disabled{opacity:.5;cursor:not-allowed}.submit-btn.needs-attention{animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(185,150,90,0)}}.unsaved-reminder{font-size:12px;color:var(--gold);background:var(--ivory-2);border:1px solid var(--gold-light);padding:7px 13px;display:none}.unsaved-reminder.show{display:block}.status-msg{font-size:13px;color:var(--ok);font-style:italic;min-height:18px}.status-msg.error{color:var(--no)}
.gift-section{margin-top:5px}.gift-msg{font-size:15px;color:var(--muted);line-height:1.6;max-width:350px;margin:9px auto 20px}.acct-box{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--ivory-2);border:1px solid var(--line);padding:14px 15px;max-width:300px;margin:0 auto 10px}.acct-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);display:block;margin-bottom:3px}.acct-number{font-size:19px;font-weight:700;color:var(--forest);letter-spacing:.08em}.copy-btn{font-family:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--forest);color:var(--gold-light);border:0;padding:9px 13px;cursor:pointer}.copy-feedback{font-size:12px;color:var(--ok);min-height:17px;margin-bottom:6px}.loading,.error-box{color:var(--muted);font-style:italic;padding:65px 20px;text-align:center;font-size:16px}
.hero-mark{font-size:13px;letter-spacing:.28em;color:var(--gold);margin-bottom:7px}.hero-mark span{font-size:9px;margin:0 5px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);max-width:330px;margin:0 auto 25px;border:1px solid var(--line);background:rgba(245,239,227,.55)}.countdown div{padding:9px 4px}.countdown div+div{border-left:1px solid var(--line)}.countdown strong{display:block;font-size:21px;color:var(--forest);font-weight:600}.countdown span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media(max-width:430px){body{padding:0 0 35px}.card{max-width:none;min-height:100vh;border-left:0;border-right:0}.card-inner{padding:28px 28px 42px}.events{grid-template-columns:1fr}.event{min-height:165px;padding:15px 5px}.event+.event{border-left:0;border-top:1px solid var(--line);padding-top:22px}.names{font-size:54px}.parents-line{font-size:25px}.date-block .big{font-size:23px}}
@media(prefers-reduced-motion:no-preference){.card-inner>*{animation:rise .65s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

  <div class="card">
    <div class="frame-outer"></div>
    <div class="frame-inner"></div>

    <svg class="corner tl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#b98b6a" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#b98b6a" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#b98b6a"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#b98b6a" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#b98b6a" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#b98b6a"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#b98b6a" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#b98b6a" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#b98b6a"/>
    </svg>
    <svg class="corner br" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#b98b6a" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#b98b6a" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#b98b6a"/>
    </svg>

    <img class="watermark" src="royal-flourish-rings.png" alt="" />

    <svg class="floral-header" viewBox="0 0 220 70" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 35c40-18 70-18 90 0" stroke="#c98fa0" stroke-width="1" opacity="0.75"/>
      <path d="M120 35c40-18 70-18 90 0" stroke="#c98fa0" stroke-width="1" opacity="0.75"/>
      <g stroke="#8a3b52" stroke-width="1.1" fill="none" opacity="0.9">
        <path d="M110 12c-4 6-4 12 0 18c4-6 4-12 0-18z"/>
        <path d="M92 20c6-2 11 0 15 6c-6 2-11 0-15-6z"/>
        <path d="M128 20c-6-2-11 0-15 6c6 2 11 0 15-6z"/>
        <circle cx="110" cy="22" r="3" fill="#c39a6e" stroke="none"/>
      </g>
      <g stroke="#8a9a7c" stroke-width="1" fill="none" opacity="0.85">
        <path d="M85 30c-2 6 1 11 6 14"/>
        <path d="M135 30c2 6-1 11-6 14"/>
      </g>
      <circle cx="55" cy="35" r="2.4" fill="#c98fa0" stroke="none"/>
      <circle cx="165" cy="35" r="2.4" fill="#c98fa0" stroke="none"/>
      <circle cx="35" cy="33" r="1.6" fill="#e8cdb3" stroke="none"/>
      <circle cx="185" cy="33" r="1.6" fill="#e8cdb3" stroke="none"/>
    </svg>

    <div class="card-inner" id="cardInner">
      <div class="loading">Loading your invitation…</div>
    </div>
  </div>

<script>
/* =========================================================
   1) CONFIGURATION — Supabase project keys
   ========================================================= */
const SUPABASE_URL = "https://dthppsntdwdtvqgwwbhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";

/* =========================================================
   2) EVENT CONTENT — one block per language.
   ========================================================= */
const EVENT = {
  monogram: 'JV',
  ceremony_map_url: 'https://maps.app.goo.gl/oxTBmFbUH9Ye2uDC8',
  reception_map_url: 'https://maps.app.goo.gl/496NayzXRB9XhyNa8',

  rsvp_deadline_iso: '2026-10-15T23:59:59',

  gift: {
    account_number: '123456789',
    whish_url: 'https://www.whish.money/locations'
  },

  en: {
    parents_line: 'Hobeika &amp; Fakhry',
    invite_copy: 'Have the pleasure of inviting you to the wedding of',
    names: 'Julien<span class="amp">&amp;</span>Vanessa',
    date_day: 'Sunday',
    date_big: 'November 1, 2026',
    ceremony_place: 'Église Maronite Saint-Élias',
    ceremony_addr: 'Fakhreddine Street, Kantari, Beirut',
    ceremony_time: '5:30 PM',
    reception_place: 'Country Lodge Club & Resort',
    reception_addr: 'Bsalim, North Metn',
    reception_time: '8:00 PM',
    deadline: 'Please confirm before October 15, 2026'
  }
};

const UI = {
  en: {
    ceremony_label: 'Ceremony',
    reception_label: 'Reception',
    location_btn: 'Location Map',
    families_label: 'The Families of',
    rsvp_heading: 'Will you be there?',
    countdown_lead: 'Time left to respond',
    days: 'Days', hours: 'Hours', mins: 'Min', secs: 'Sec',
    attend_btn: "I'll be there",
    decline_btn: "I can't make it",
    submit_btn: 'Send my response',
    saving: 'Saving…',
    saved_ok: 'Thank you! Your response has been recorded.',
    need_all: 'Please answer for each guest before sending.',
    error_generic: 'Something went wrong, please try again.',
    unsaved_reminder: "Don't forget to press \"Send my response\" below ↓",
    leave_warning: 'Your response has not been sent yet. Are you sure you want to leave?',
    loading: 'Loading your invitation…',
    incomplete_link: "This invitation link is incomplete.<br>Please use the link that was sent to you.",
    not_found: 'Invitation not found.<br>Please check your link.',
    gift_heading: 'Gift Registry',
    gift_msg: 'Sharing our joy with you is what matters most. For those who wish, a gift may be sent via Whish Money.',
    account_label: 'Account Number',
    copy_btn: 'Copy',
    copied_msg: 'Copied to clipboard ✓',
    whish_btn: 'Whish Locations'
  }
};
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cardInner = document.getElementById('cardInner');

const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>';
const ICON_CHURCH = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v4M10 4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 6l9 6v10H3V12l9-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 22v-6h4v6" stroke="currentColor" stroke-width="1.6"/></svg>';

function getSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get('invite');
}

const currentLang = 'en';
let loadState = 'loading';
let cachedInvite = null;
let cachedGuests = null;
let draft = {};

function paint(){
  const t = UI[currentLang];
  if(loadState === 'loading'){ cardInner.innerHTML = `<div class="loading">${t.loading}</div>`; return; }
  if(loadState === 'empty-slug'){ cardInner.innerHTML = `<div class="error-box">${t.incomplete_link}</div>`; return; }
  if(loadState === 'not-found'){ cardInner.innerHTML = `<div class="error-box">${t.not_found}</div>`; return; }
  renderShell(cachedInvite, cachedGuests);
}

function renderShell(invite, guests){
  const t = UI[currentLang];
  const e = EVENT[currentLang];

  cardInner.innerHTML = `
    <div class="hero-mark">J <span>✦</span> V</div>
    ${e.parents_line ? `
      <div class="eyebrow">${t.families_label}</div>
      <div class="parents-line">${e.parents_line}</div>
    ` : `<div class="monogram">${EVENT.monogram}</div>`}

    <div class="invite-copy">${e.invite_copy}</div>

    <div class="names">${e.names}</div>
    <p class="presented-by">${invite.note || ''}</p>

    <div class="rule"></div>

    <div class="date-block">
      <div class="day">${e.date_day}</div>
      <div class="big">${e.date_big}</div>
    </div>

    <div class="countdown" id="countdown"><div><strong id="cdDays">—</strong><span>Days</span></div><div><strong id="cdHours">—</strong><span>Hours</span></div><div><strong id="cdMins">—</strong><span>Min</span></div><div><strong id="cdSecs">—</strong><span>Sec</span></div></div>

    <div class="events">
      <div class="event">
        <div class="label">${t.ceremony_label}</div>
        <div class="place">${e.ceremony_place}</div>
        <div class="addr">${e.ceremony_addr}</div>
        <div class="sub">${e.ceremony_time}</div>
        <a class="map-btn" href="${EVENT.ceremony_map_url}" target="_blank" rel="noopener">${ICON_CHURCH}${t.location_btn}</a>
      </div>
      <div class="event">
        <div class="label">${t.reception_label}</div>
        <div class="place">${e.reception_place}</div>
        <div class="addr">${e.reception_addr}</div>
        <div class="sub">${e.reception_time}</div>
        <a class="map-btn" href="${EVENT.reception_map_url}" target="_blank" rel="noopener">${ICON_PIN}${t.location_btn}</a>
      </div>
    </div>

    <div class="rule"></div>

    <div class="rsvp">
      <h2>${t.rsvp_heading}</h2>
      <div class="deadline">${e.deadline}</div>
      <div id="guestRows"></div>
      <div class="submit-row">
        <div class="unsaved-reminder" id="unsavedReminder"></div>
        <button class="submit-btn" id="submitBtn">${t.submit_btn}</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="gift-section">
      <div class="gift-heading">${t.gift_heading}</div>
      <p class="gift-msg">${t.gift_msg}</p>
      <div class="copy-feedback" id="copyFeedback"></div>
      <div class="acct-box">
        <div>
          <span class="acct-label">${t.account_label}</span>
          <span class="acct-number">${EVENT.gift.account_number}</span>
        </div>
        <button class="copy-btn" id="copyBtn">${t.copy_btn}</button>
      </div>
      <a class="map-btn" href="${EVENT.gift.whish_url}" target="_blank" rel="noopener">${ICON_PIN}${t.whish_btn}</a>
    </div>
  `;

  document.getElementById('copyBtn').onclick = async () => {
    const fb = document.getElementById('copyFeedback');
    try{
      await navigator.clipboard.writeText(EVENT.gift.account_number);
    }catch(err){
      const tmp = document.createElement('input');
      tmp.value = EVENT.gift.account_number;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    }
    fb.textContent = t.copied_msg;
    setTimeout(() => { fb.textContent = ''; }, 1800);
  };

  function hasUnsavedChanges(){
    return guests.some(g => draft[g.id] && draft[g.id] !== g.status);
  }

  function updateReminderState(){
    const reminderEl = document.getElementById('unsavedReminder');
    const submitBtn = document.getElementById('submitBtn');
    if(!reminderEl || !submitBtn) return;
    const unsaved = hasUnsavedChanges();
    reminderEl.textContent = t.unsaved_reminder;
    reminderEl.classList.toggle('show', unsaved);
    submitBtn.classList.toggle('needs-attention', unsaved);
  }

  function renderRows(){
    const rowsEl = document.getElementById('guestRows');
    rowsEl.innerHTML = '';
    guests.forEach(g => {
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-name">${g.member_name}</div>
        <div class="choice">
          <button class="pill attend ${draft[g.id]==='attending'?'active':''}">${t.attend_btn}</button>
          <button class="pill decline ${draft[g.id]==='declined'?'active':''}">${t.decline_btn}</button>
        </div>`;
      const [attendBtn, declineBtn] = row.querySelectorAll('.pill');
      attendBtn.onclick = () => { draft[g.id] = 'attending'; renderRows(); };
      declineBtn.onclick = () => { draft[g.id] = 'declined'; renderRows(); };
      rowsEl.appendChild(row);
    });
    updateReminderState();
  }
  renderRows();

  function updateCountdown(){
    const target = new Date(EVENT.rsvp_deadline_iso).getTime();
    const diff = Math.max(0, target - Date.now());
    const vals=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];
    ['cdDays','cdHours','cdMins','cdSecs'].forEach((id,i)=>{const el=document.getElementById(id); if(el) el.textContent=String(vals[i]).padStart(2,'0')});
  }
  updateCountdown();
  const countdownTimer=setInterval(updateCountdown,1000);

  document.getElementById('submitBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const allAnswered = guests.every(g => draft[g.id] === 'attending' || draft[g.id] === 'declined');
    if(!allAnswered){
      statusMsg.textContent = t.need_all;
      statusMsg.className = 'status-msg error';
      return;
    }
    submitBtn.disabled = true;
    statusMsg.textContent = t.saving;
    statusMsg.className = 'status-msg';
    try{
      for(const g of guests){
        const { error } = await sb.from('guests')
          .update({ status: draft[g.id], responded_at: new Date().toISOString() })
          .eq('id', g.id);
        if(error) throw error;
        g.status = draft[g.id];
      }
      statusMsg.textContent = t.saved_ok;
      statusMsg.className = 'status-msg';
      updateReminderState();
    }catch(err){
      console.error(err);
      statusMsg.textContent = t.error_generic;
      statusMsg.className = 'status-msg error';
    }
    submitBtn.disabled = false;
  };
}

window.addEventListener('beforeunload', (e) => {
  if(loadState !== 'ready' || !cachedGuests) return;
  const unsaved = cachedGuests.some(g => draft[g.id] && draft[g.id] !== g.status);
  if(unsaved){
    e.preventDefault();
    e.returnValue = '';
  }
});

async function init(){
  const slug = getSlug();
  if(!slug){ loadState = 'empty-slug'; paint(); return; }
  try{
    const { data: invite, error: inviteErr } = await sb.from('invites').select('*').eq('slug', slug).single();
    if(inviteErr || !invite) throw new Error('invite not found');
    const { data: guests, error: guestsErr } = await sb.from('guests').select('*').eq('invite_slug', slug);
    if(guestsErr) throw guestsErr;

    cachedInvite = invite;
    cachedGuests = guests;
    guests.forEach(g => { draft[g.id] = g.status; });
    loadState = 'ready';
    paint();
  }catch(e){
    console.error(e);
    loadState = 'not-found';
    paint();
  }
}

init();
</script>
</body>
</html>
