function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function getParams(){

  const params =
    new URLSearchParams(window.location.search);

  return {
    invite:
      params.get('invite'),

    lang:
      params.get('lang') === 'ar'
        ? 'ar'
        : 'en'
  };
}

function setLanguage(lang){

  currentLang = lang;

  document.documentElement.lang =
    lang === 'ar'
      ? 'ar'
      : 'en';

  document.body.classList.toggle(
    'ar',
    lang === 'ar'
  );

  document.body.dir =
    lang === 'ar'
      ? 'rtl'
      : 'ltr';
}

        `
    }

    <div class="parents-line">
      ${e.parents_line}
    </div>

    <div class="invite-copy">
      ${e.invite_copy}
    </div>

    <div class="names">
      ${e.names}
    </div>

    ${
      e.verse
        ? `
          <div class="verse">
            ${e.verse}

            ${
              e.verse_ref
                ? `
                  <span class="verse-ref">
                    ${e.verse_ref}
                  </span>
                `
                : ''
            }
          </div>
        `
        : ''
    }

    <div class="date-block">

      <div class="day">
        ${e.date_day}
      </div>

      <div class="big">
        ${e.date_big}
      </div>

    </div>

    <div class="events">

      <div class="event">

        <div class="label">
          ${t.ceremony_label}
        </div>

        <div class="place">
          ${e.ceremony_place}
        </div>

        <div class="addr">
          ${e.ceremony_addr}
        </div>

        <div class="sub">
          ${e.ceremony_time}
        </div>

        <a
          class="map-btn"
          href="${EVENT.ceremony_map_url}"
          target="_blank"
          rel="noopener"
        >
          ${t.location_btn}
        </a>

      </div>

      <div class="event">

        <div class="label">
          ${t.reception_label}
        </div>

        <div class="place">
          ${e.reception_place}
        </div>

        <div class="addr">
          ${e.reception_addr}
        </div>

        <div class="sub">
          ${e.reception_time}
        </div>

        <a
          class="map-btn"
          href="${EVENT.reception_map_url}"
          target="_blank"
          rel="noopener"
        >
          ${t.location_btn}
        </a>

      </div>

    </div>

    <div class="rsvp">

      <h2>
        ${t.rsvp_heading}
      </h2>

      <div class="deadline">
        ${e.deadline}
      </div>

      <div id="countdown"></div>

      <div id="guest-list" class="guest-list"></div>

      <button
        id="submit-btn"
        class="submit-btn"
        disabled
      >
        ${t.submit_btn}
      </button>

      <div
        id="unsaved-reminder"
        class="unsaved-reminder"
      >
        ${t.unsaved_reminder}
      </div>

      <div
        id="status-msg"
        class="status-msg"
      ></div>

    </div>

    <div class="gift-section">

      ${
        t.gift_heading
          ? `
            <div class="gift-heading">
              ${t.gift_heading}
            </div>
          `
          : ''
      }

      <div class="gift-msg">
        ${t.gift_msg}
      </div>

      <div class="account-box">

        <span class="acct-label">
          ${t.account_label}
        </span>

        <div class="account-number">
          ${EVENT.gift.account_number}
        </div>

        <button
          id="copy-btn"
          class="copy-btn"
          type="button"
        >
          ${t.copy_btn}
        </button>

        <span
          id="copy-feedback"
          class="copy-feedback"
        ></span>

        <br>

        <a
          class="whish-btn"
          href="${EVENT.gift.whish_url}"
          target="_blank"
          rel="noopener"
        >
          ${t.whish_btn}
        </a>

      </div>

    </div>

    <div class="footer">
      JULIEN &amp; VANESSA
    </div>
  `;

  document
    .getElementById('copy-btn')
    ?.addEventListener('click', copyAccount);

  document
    .getElementById('submit-btn')
    ?.addEventListener('click', submitRSVP);

  renderGuests();
}

function renderGuests(){

  const container =
    document.getElementById('guest-list');

  if(!container){
    return;
  }

  container.innerHTML =
    currentGuests.map(guest => {

      const answer =
        answers[guest.id] || '';

      return `

        <div
          class="guest-row"
          data-guest-id="${guest.id}"
        >

          <div class="guest-name">
            ${escapeHtml(guest.name)}
          </div>

          <div class="pill-group">

            <button
              type="button"
              class="pill attend ${answer === 'attend' ? 'active' : ''}"
              onclick="setAnswer('${guest.id}','attend')"
            >
              ${UI[currentLang].attend_btn}
            </button>

            <button
              type="button"
              class="pill decline ${answer === 'decline' ? 'active' : ''}"
              onclick="setAnswer('${guest.id}','decline')"
            >
              ${UI[currentLang].decline_btn}
            </button>

          </div>

        </div>
      `;
    })
    .join('');

  updateSubmitState();
}

window.setAnswer = function(guestId, value){

  answers[guestId] = value;

  isDirty = true;

  const row =
    document.querySelector(
      `[data-guest-id="${guestId}"]`
    );

  if(!row){
    return;
  }

  row
    .querySelector('.attend')
    ?.classList.toggle(
      'active',
      value === 'attend'
    );

  row
    .querySelector('.decline')
    ?.classList.toggle(
      'active',
      value === 'decline'
    );

  updateSubmitState();

  const reminder =
    document.getElementById('unsaved-reminder');

  if(reminder){
    reminder.style.display = 'block';
  }
};

function updateSubmitState(){

  const btn =
    document.getElementById('submit-btn');

  if(!btn){
    return;
  }

  const complete =
    currentGuests.length > 0 &&
    currentGuests.every(
      guest => answers[guest.id]
    );

  btn.disabled = !complete;
}

async function loadInvitation(slug){

  if(!slug){

    document.getElementById('app').innerHTML = `
      <div class="error-box">
        ${UI[currentLang].incomplete_link}
      </div>
    `;

    return;
  }

  const {
    data: invite,
    error: inviteError
  } = await sb
    .from('invites')
    .select('*')
    .eq('slug', slug)
    .maybeSingle();

  if(inviteError || !invite){

    document.getElementById('app').innerHTML = `
      <div class="error-box">
        ${UI[currentLang].not_found}
      </div>
    `;

    return;
  }

  currentInvite = invite;

  const {
    data: guests,
    error: guestsError
  } = await sb
    .from('guests')
    .select('*')
    .eq('invite_slug', slug)
    .order('id');

  if(guestsError){

    document.getElementById('app').innerHTML = `
      <div class="error-box">
        ${UI[currentLang].error_generic}
      </div>
    `;

    return;
  }

  currentGuests = guests || [];

  currentGuests.forEach(guest => {

    if(
      guest.rsvp_status === 'attend' ||
      guest.rsvp_status === 'decline'
    ){

      answers[guest.id] =
        guest.rsvp_status;
    }

  });

  renderShell();

  startCountdown();
}

async function submitRSVP(){

  const t = UI[currentLang];

  const incomplete =
    currentGuests.some(
      guest => !answers[guest.id]
    );

  if(incomplete){

    showStatus(
      t.need_all,
      true
    );

    return;
  }

  const button =
    document.getElementById('submit-btn');

  button.disabled = true;

  button.textContent =
    t.saving;

  try{

    for(const guest of currentGuests){

      const { error } =
        await sb
          .from('guests')
          .update({
            rsvp_status:
              answers[guest.id],

            rsvp_updated_at:
              new Date().toISOString()
          })
          .eq('id', guest.id);

      if(error){
        throw error;
      }
    }

    isDirty = false;

    const reminder =
      document.getElementById('unsaved-reminder');

    if(reminder){
      reminder.style.display = 'none';
    }

    showStatus(
      t.saved_ok,
      false
    );

    button.textContent =
      t.submit_btn;

  }catch(error){

    console.error(error);

    button.disabled = false;

    button.textContent =
      t.submit_btn;

    showStatus(
      t.error_generic,
      true
    );
  }

  updateSubmitState();
}

function showStatus(message, error){

  const element =
    document.getElementById('status-msg');

  if(!element){
    return;
  }

  element.textContent =
    message;

  element.style.color =
    error
      ? 'var(--danger)'
      : 'var(--green)';
}

function copyAccount(){

  const feedback =
    document.getElementById('copy-feedback');

  navigator.clipboard
    .writeText(EVENT.gift.account_number)
    .then(() => {

      feedback.textContent =
        UI[currentLang].copied_msg;

      setTimeout(() => {

        feedback.textContent = '';

      },2500);

    })
    .catch(() => {

      feedback.textContent =
        UI[currentLang].error_generic;

    });
}

function startCountdown(){

  const container =
    document.getElementById('countdown');

  if(!container){
    return;
  }

  function update(){

    const now =
      new Date().getTime();

    const deadline =
      new Date(
        EVENT.rsvp_deadline_iso
      ).getTime();

    let diff =
      deadline - now;

    if(diff < 0){
      diff = 0;
    }

    const day =
      1000 * 60 * 60 * 24;

    const hour =
      1000 * 60 * 60;

    const minute =
      1000 * 60;

    const days =
      Math.floor(diff / day);

    const hours =
      Math.floor(
        (diff % day) / hour
      );

    const mins =
      Math.floor(
        (diff % hour) / minute
      );

    const secs =
      Math.floor(
        (diff % minute) / 1000
      );

    container.innerHTML = `
      <div style="
        display:flex;
        justify-content:center;
        gap:18px;
        margin:0 0 25px;
        color:var(--gold-deep);
        font-family:'Montserrat',sans-serif;
        font-size:10px;
      ">

        <div>
          <strong style="font-size:18px;">
            ${days}
          </strong><br>
          ${UI[currentLang].days}
        </div>

        <div>
          <strong style="font-size:18px;">
            ${hours}
          </strong><br>
          ${UI[currentLang].hours}
        </div>

        <div>
          <strong style="font-size:18px;">
            ${mins}
          </strong><br>
          ${UI[currentLang].mins}
        </div>

        <div>
          <strong style="font-size:18px;">
            ${secs}
          </strong><br>
          ${UI[currentLang].secs}
        </div>

      </div>
    `;
  }

  update();

  setInterval(update,1000);
}

window.addEventListener(
  'beforeunload',
  function(event){

    if(!isDirty){
      return;
    }

    event.preventDefault();

    event.returnValue =
      UI[currentLang].leave_warning;

    return UI[currentLang].leave_warning;
  }
);

(async function(){

  const {
    invite,
    lang
  } = getParams();

  setLanguage(lang);

  await loadInvitation(invite);

})();
</script>

</body>
</html>
