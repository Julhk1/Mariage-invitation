<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Julien & Vanessa — Invitation</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Julien & Vanessa — Wedding Invitation">
<meta property="og:description" content="You are warmly invited to celebrate our wedding on Sunday, November 1, 2026. Kindly confirm your attendance by October 15, 2026.">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Parisienne&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  :root{
    --emerald-1:#294532;
    --emerald-2:#1f3325;
    --emerald-3:#345940;
    --paper:#faf5e8;
    --paper-edge:#f3ecda;
    --ink:#2b271e;
    --ink-soft:#5b5646;
    --gold:#b8935b;
    --gold-deep:#9c7a48;
    --gold-light:#e6d7ab;
    --line:#d9cba4;
    --ok-bg:#e4efe1;
    --ok-text:#3c6b41;
    --no-bg:#f3e3de;
    --no-text:#a2503e;
    --rose:#b8935b;
    --rose-deep:#9c7a48;
    --sage:#6f8a6a;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    background:linear-gradient(180deg, #1f3325, #294532);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    padding:22px 12px 50px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card{
    width:100%;
    max-width:480px;
    background:var(--paper);
    border-radius:2px;
    box-shadow:
      0 40px 80px -24px rgba(0,0,0,0.6),
      0 16px 40px -18px rgba(0,0,0,0.3),
      0 0 0 1px rgba(189,154,95,0.35);
    overflow:hidden;
    position:relative;
    z-index:1;
  }

  .frame-outer{
    position:absolute;
    inset:9px;
    border:1.5px solid var(--gold);
    pointer-events:none;
    z-index:3;
  }

  .frame-inner{
    position:absolute;
    inset:14px;
    border:1px solid var(--gold-deep);
    pointer-events:none;
    z-index:3;
    opacity:0.55;
  }

  .corner{
    position:absolute;
    width:34px;
    height:34px;
    z-index:3;
    pointer-events:none;
  }

  .corner.tl{
    top:6px;
    left:6px;
  }

  .corner.tr{
    top:6px;
    right:6px;
    transform:scaleX(-1);
  }

  .corner.bl{
    bottom:6px;
    left:6px;
    transform:scaleY(-1);
  }

  .corner.br{
    bottom:6px;
    right:6px;
    transform:scale(-1,-1);
  }

  .watermark{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:62%;
    max-width:260px;
    opacity:0.20;
    z-index:1;
    pointer-events:none;
    object-fit:contain;
  }

  .card-inner{
    padding:clamp(14px,4vw,20px) clamp(22px,6vw,42px) clamp(34px,7vw,46px);
    text-align:center;
    position:relative;
    z-index:2;
  }

  .crown{
    width:40px;
    height:auto;
    margin:0 auto 10px;
    display:block;
  }

  .monogram{
    font-family:'Parisienne', cursive;
    font-size:clamp(34px,9vw,44px);
    color:var(--gold-deep);
    margin-bottom:18px;
  }

  .eyebrow{
    font-size:11.5px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:10px;
  }

  .parents-line{
    font-family:'Parisienne', cursive;
    font-size:clamp(21px,5.5vw,26px);
    color:var(--ink);
    margin-bottom:20px;
    line-height:1.3;
  }

  .invite-copy{
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    line-height:1.9;
    max-width:320px;
    margin:0 auto 22px;
  }

  .names{
    font-family:'Parisienne', cursive;
    font-size:clamp(42px,12vw,58px);
    line-height:1.4;
    margin-bottom:16px;
    padding-top:0.12em;
    color:var(--emerald-1);
  }

  .names .amp{
    color:var(--gold-deep);
    font-size:0.65em;
    margin:0 4px;
  }

  .presented-by{
    font-size:14.5px;
    color:var(--ink-soft);
    font-style:italic;
    max-width:340px;
    margin:0 auto 22px;
    line-height:1.55;
  }

  .rule{
    width:64px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:20px auto;
    position:relative;
  }

  .rule::before{
    content:"❖";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:var(--paper);
    color:var(--gold-deep);
    font-size:12px;
    padding:0 8px;
  }

  .floral-header{
    width:min(220px,70%);
    height:auto;
    margin:28px auto 6px;
    display:block;
    position:relative;
    z-index:2;
  }

  .date-block{
    margin:6px 0 24px;
    position:relative;
  }

  .date-block .day{
    font-size:12.5px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-deep);
  }

  .date-block .big{
    font-size:clamp(20px,5.5vw,26px);
    letter-spacing:0.1em;
    margin-top:8px;
    font-weight:600;
    display:inline-block;
    padding:0 6px;
    position:relative;
  }

  .date-block .big::before,
  .date-block .big::after{
    content:"";
    position:absolute;
    top:50%;
    width:22px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold));
  }

  .date-block .big::before{
    left:-26px;
  }

  .date-block .big::after{
    right:-26px;
    transform:scaleX(-1);
  }

  .events{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:0;
    margin-bottom:4px;
    width:100%;
  }

  .event{
    flex:1 1 0;
    max-width:210px;
    padding:0 12px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
  }

  .event + .event{
    border-left:1px solid var(--line);
  }

  .event .label{
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.16em;
    color:var(--gold-deep);
    margin-bottom:6px;
  }

  .event .place{
    font-size:16px;
    font-weight:600;
    line-height:1.3;
  }

  .event .addr{
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.4;
    margin-top:2px;
  }

  .event .sub{
    font-size:13.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:3px;
  }

  .map-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    align-self:center;
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.05em;
    color:var(--gold-deep);
    background:transparent;
    border:1px solid var(--gold-deep);
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
    text-decoration:none;
    transition:
      background .25s ease,
      color .25s ease,
      box-shadow .25s ease,
      transform .15s ease;
  }

  .event .map-btn{
    margin-top:auto;
    align-self:center;
    padding-top:7px;
  }

  .gift-section .map-btn{
    margin-top:10px;
  }

  .map-btn:hover{
    background:var(--gold-deep);
    color:var(--paper);
    box-shadow:0 8px 18px -8px rgba(156,107,82,0.6);
    transform:translateY(-1px);
  }

  .map-btn svg{
    width:12px;
    height:12px;
    flex-shrink:0;
  }

  .rsvp{
    margin-top:32px;
  }

  .rsvp h2{
    font-family:'Parisienne', cursive;
    font-weight:400;
    font-size:clamp(26px,7vw,32px);
  }

  .rsvp .deadline{
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin:2px 0 16px;
  }

  .guest-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 2px;
    border-bottom:1px solid var(--line);
    text-align:left;
    flex-wrap:wrap;
  }

  .guest-row:last-of-type{
    border-bottom:none;
  }

  .guest-name{
    font-size:17px;
    font-weight:600;
    flex:1 1 100%;
  }

  .choice{
    display:flex;
    gap:8px;
    width:100%;
  }

  .pill{
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    padding:11px 10px;
    border-radius:24px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    flex:1;
    min-height:44px;
  }

  .pill:active{
    transform:scale(0.97);
  }

  .pill.attend.active{
    background:var(--ok-bg);
    border-color:var(--ok-text);
    color:var(--ok-text);
    box-shadow:0 4px 12px -6px rgba(92,122,82,0.5);
  }

  .pill.decline.active{
    background:var(--no-bg);
    border-color:var(--no-text);
    color:var(--no-text);
    box-shadow:0 4px 12px -6px rgba(156,74,72,0.5);
  }

  .submit-row{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .submit-btn{
    font-family:inherit;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-size:12.5px;
    font-weight:700;
    color:var(--gold-light);
    background:linear-gradient(160deg, var(--emerald-1) 0%, var(--emerald-2) 100%);
    border:1px solid var(--gold);
    padding:15px 10px;
    border-radius:4px;
    cursor:pointer;
    box-shadow:
      0 10px 24px -12px rgba(42,54,96,0.65),
      inset 0 1px 0 rgba(232,205,179,0.15);
    transition:
      background .25s ease,
      box-shadow .25s ease,
      transform .15s ease;
    width:100%;
    max-width:280px;
    min-height:48px;
  }

  .submit-btn:hover{
    background:linear-gradient(160deg, var(--emerald-3) 0%, var(--emerald-2) 100%);
    box-shadow:
      0 14px 30px -12px rgba(42,54,96,0.75),
      inset 0 1px 0 rgba(232,205,179,0.2);
  }

  .submit-btn:active{
    transform:translateY(1px);
  }

  .submit-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .submit-btn.needs-attention{
    animation:pulse-glow 1.6s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%,100%{
      box-shadow:0 0 0 0 rgba(195,154,110,0.55);
    }

    50%{
      box-shadow:0 0 0 8px rgba(195,154,110,0);
    }
  }

  .unsaved-reminder{
    font-size:12.5px;
    font-weight:600;
    color:var(--gold-deep);
    background:var(--paper-edge);
    border:1px solid var(--gold-light);
    border-radius:20px;
    padding:6px 14px;
    margin-bottom:4px;
    display:none;
    text-align:center;
  }

  .unsaved-reminder.show{
    display:block;
  }

  .status-msg{
    font-size:13.5px;
    color:var(--ok-text);
    font-style:italic;
    min-height:18px;
  }

  .status-msg.error{
    color:var(--no-text);
  }

  /* gift registry */
  .gift-section{
    margin-top:32px;
  }

  .gift-heading{
    font-family:'Parisienne', cursive;
    font-weight:400;
    font-size:clamp(26px,7vw,32px);
  }

  .gift-msg{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.6;
    max-width:340px;
    margin:10px auto 20px;
  }

  .acct-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--paper-edge);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 16px;
    max-width:280px;
    margin:0 auto 16px;
  }

  .acct-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--gold-deep);
    display:block;
    margin-bottom:2px;
  }

  .acct-number{
    font-size:18px;
    font-weight:700;
    letter-spacing:0.04em;
  }

  .copy-btn{
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    background:var(--emerald-2);
    color:var(--gold-light);
    border:none;
    border-radius:16px;
    padding:8px 14px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease;
  }

  .copy-btn:hover{
    background:var(--emerald-3);
  }

  .copy-feedback{
    font-size:12.5px;
    color:var(--ok-text);
    font-weight:600;
    min-height:16px;
    margin-bottom:6px;
  }

  .loading,
  .error-box{
    color:var(--ink-soft);
    font-style:italic;
    padding:48px 20px;
    text-align:center;
  }

  /* =========================================================
     VERSE
     ========================================================= */

  .verse{
    font-family:'Cormorant Garamond', serif;
    font-size:16px;
    line-height:1.8;
    color:var(--gold-deep);
    max-width:320px;
    margin:0 auto 24px;
  }

  .verse-ref{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--gold-deep);
    margin-top:3px;
  }

  /* =========================================================
     VERSION ARABE (RTL)
     ========================================================= */

  body.ar{
    font-family:'Cormorant Garamond','Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  }

  body.ar .card-inner{
    line-height:1.9;
  }

  body.ar .eyebrow,
  body.ar .invite-copy,
  body.ar .date-block .day,
  body.ar .date-block .big,
  body.ar .event .label,
  body.ar .acct-label,
  body.ar .submit-btn,
  body.ar .map-btn,
  body.ar .copy-btn,
  body.ar .pill{
    letter-spacing:0;
    text-transform:none;
  }

  body.ar .presented-by,
  body.ar .rsvp .deadline,
  body.ar .event .sub,
  body.ar .status-msg,
  body.ar .loading,
  body.ar .error-box{
    font-style:normal;
  }

  body.ar .verse{
    font-family:'Cormorant Garamond','Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
    font-size:18px;
    line-height:2.05;
    margin-bottom:26px;
  }

  body.ar .verse-ref{
    font-family:'Cormorant Garamond','Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
    font-size:13px;
    letter-spacing:0;
    margin-top:2px;
  }

  body.ar .eyebrow{
    font-size:17px;
    font-weight:700;
    margin-bottom:4px;
  }

  body.ar .invite-copy{
    font-size:17.5px;
    line-height:2;
    max-width:340px;
    margin-bottom:20px;
    color:var(--ink-soft);
  }

  body.ar .presented-by{
    font-size:16.5px;
  }

  body.ar .verse,
  body.ar .invite-copy,
  body.ar .rsvp .deadline,
  body.ar .gift-msg,
  body.ar .event .place,
  body.ar .event .addr,
  body.ar .presented-by{
    text-wrap:balance;
  }

  body.ar .parents-line,
  body.ar .names{
    direction:ltr;
    unicode-bidi:isolate;
  }

  body.ar .date-block .day{
    font-size:17.5px;
    font-weight:700;
    letter-spacing:0;
  }

  body.ar .date-block .big{
    font-size:clamp(22px,6vw,28px);
    letter-spacing:0;
    font-weight:700;
  }

  body.ar .event .label{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
  }

  body.ar .event .place{
    font-size:18.5px;
    font-weight:700;
    line-height:1.5;
  }

  body.ar .event .addr{
    font-size:15px;
    line-height:1.6;
  }

  body.ar .event .sub{
    font-size:16.5px;
    line-height:1.6;
    margin-top:4px;
  }

  body.ar .event + .event{
    border-left:none;
    border-right:1px solid var(--line);
  }

  body.ar .map-btn{
    font-size:14px;
    padding:6px 16px;
  }

  body.ar .rsvp h2,
  body.ar .gift-heading{
    font-family:'Aref Ruqaa','Amiri',serif;
    font-weight:400;
    font-size:clamp(30px,8vw,36px);
    line-height:1.6;
  }

  body.ar .rsvp .deadline{
    font-size:16px;
  }

  body.ar .rsvp h2{
    text-wrap:balance;
    font-size:clamp(25px,6.8vw,31px);
  }

  /* FIX UNIQUEMENT POUR "ومشاركتكم" */
  body.ar .rsvp h2 .nowrap{
    white-space:nowrap;
  }

  body.ar .guest-row{
    text-align:right;
  }

  body.ar .guest-name{
    font-size:18px;
  }

  body.ar .pill{
    font-size:16.5px;
    font-weight:700;
  }

  body.ar .submit-btn{
    font-size:17px;
    font-weight:700;
  }

  body.ar .unsaved-reminder{
    font-size:14.5px;
  }

  body.ar .status-msg{
    font-size:15px;
  }

  body.ar .gift-msg{
    font-size:16.5px;
    line-height:1.9;
  }

  body.ar .acct-label{
    font-size:14px;
    font-weight:700;
  }

  body.ar .copy-btn{
    font-size:14px;
  }

  body.ar .copy-feedback{
    font-size:14px;
  }

  @media (max-width:400px){
    body.ar .event + .event{
      border-right:none;
      border-top:1px solid var(--line);
    }

    body.ar .pill{
      font-size:15px;
      padding-left:6px;
      padding-right:6px;
    }
  }

  @media (max-width:400px){
    .events{
      flex-direction:column;
      gap:16px;
    }

    .event{
      margin:0 auto;
    }

    .event + .event{
      border-left:none;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
  }
</style>
</head>

<body>

  <div class="card">

    <div class="frame-outer"></div>
    <div class="frame-inner"></div>

    <svg class="corner tl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cornerGold" x1="0" y1="60" x2="60" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#294532"/>
          <stop offset="45%" stop-color="#e8cdb3"/>
          <stop offset="100%" stop-color="#9c6b52"/>
        </linearGradient>
      </defs>
      <path d="M4 40 C4 20 20 4 40 4" stroke="url(#cornerGold)" stroke-width="1.1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="url(#cornerGold)" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="url(#cornerGold)"/>
    </svg>

    <svg class="corner tr" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="url(#cornerGold)" stroke-width="1.1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="url(#cornerGold)" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="url(#cornerGold)"/>
    </svg>

    <svg class="corner bl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="url(#cornerGold)" stroke-width="1.1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="url(#cornerGold)" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="url(#cornerGold)"/>
    </svg>

    <svg class="corner br" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="url(#cornerGold)" stroke-width="1.1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="url(#cornerGold)" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="url(#cornerGold)"/>
    </svg>

    <img class="watermark" src="royal-flourish-rings.png" alt="" />

    <div class="events">

      <div class="event">

      </div>

      <div class="event">

        <div class="label">
          ${t.reception_label}
        </div>

        <div class="place">
          ${e.reception_place}
        </div>

        <div class="addr">
          ${e.reception_addr}
        </div>

        <div class="sub">
          ${e.reception_time}
        </div>

        <a
          class="map-btn"
          href="${EVENT.reception_map_url}"
          target="_blank"
          rel="noopener"
        >
          ${ICON_PIN}
          ${t.location_btn}

      </div>

    </div>

    <div class="rule"></div>

    <div class="rsvp">

      <h2>

      </h2>

      <div class="deadline">

      </div>

      <div id="guestRows"></div>

      <div class="submit-row">

        <div

  document.getElementById('copyBtn').onclick =

      try{

      }catch(err){

        const tmp =
          document.createElement('input');

        document.body.appendChild(tmp);

        tmp.select();

        document.execCommand('copy');

        document.body.removeChild(tmp);

  function hasUnsavedChanges(){

      g =>
        draft[g.id] &&
        draft[g.id] !== g.status

      document.getElementById('unsavedReminder');

      document.getElementById('submitBtn');

    const unsaved =
      hasUnsavedChanges();

      t.unsaved_reminder;

    reminderEl.classList.toggle(
      'show',
      unsaved
    );

    submitBtn.classList.toggle(
      'needs-attention',
      unsaved
    );

  function renderRows(){

      document.getElementById('guestRows');

    rowsEl.innerHTML = '';

    guests.forEach(g => {

      const row =

      row.innerHTML = `

              draft[g.id] === 'declined'
                ? 'active'
                : ''
            }"

            ${t.decline_btn}
          </button>

        declineBtn

        renderRows();

      declineBtn.onclick = () => {

        document.getElementById('statusMsg');

      const submitBtn =
        document.getElementById('submitBtn');

        guests.every(
          g =>
            draft[g.id] === 'attending' ||
            draft[g.id] === 'declined'

        statusMsg.textContent =
          t.need_all;

        statusMsg.className =
          'status-msg error';

        return;

      submitBtn.disabled = true;

      statusMsg.textContent =
        t.saving;

              .update({

                responded_at:

              })

          g.status =
            draft[g.id];

          t.saved_ok;

        statusMsg.className =

          t.error_generic;

        statusMsg.className =

    };
}

window.addEventListener(
  'beforeunload',

    if(
      loadState !== 'ready' ||
      !cachedGuests
    )
      return;

    const unsaved =
      cachedGuests.some(
        g =>
          draft[g.id] &&
          draft[g.id] !== g.status
      );

    if(unsaved){

      e.preventDefault();

      e.returnValue = '';
    }
  }
);

async function init(){

  const slug =
    getSlug();

  if(!slug){

    loadState =
      'empty-slug';

    paint();

    return;
  }

  try{

    const {
      data: invite,
      error: inviteErr
    } =
      await sb
        .from('invites')
        .select('*')
        .eq('slug', slug)
        .single();

    if(inviteErr || !invite)
      throw new Error(
        'invite not found'
      );

    const {
      data: guests,
      error: guestsErr
    } =
      await sb
        .from('guests')
        .select('*')
        .eq('invite_slug', slug);

    if(guestsErr)
      throw guestsErr;

    /* ordre choisi dans l'admin
       (colonne "position") ;
       sans position, l'ordre d'origine est conservé */

    const ordered =
      (guests || [])
        .map((g, i) => ({
          g,
          i
        }))
        .sort((a, b) => {

          const pa =
            a.g.position;

          const pb =
            b.g.position;

          const ha =
            pa !== null &&
            pa !== undefined;

          const hb =
            pb !== null &&
            pb !== undefined;

          if(
            ha &&
            hb &&
            pa !== pb
          )
            return pa - pb;

          if(
            ha &&
            !hb
          )
            return -1;

          if(
            !ha &&
            hb
          )
            return 1;

          return a.i - b.i;

        })
        .map(x => x.g);

    cachedInvite =
      invite;

    cachedGuests =
      ordered;

    guests.forEach(
      g => {
        draft[g.id] =
          g.status;
      }
    );

    loadState =
      'ready';

    paint();

  }catch(e){

    console.error(e);

    loadState =
      'not-found';

    paint();
  }
}
