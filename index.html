<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Julien & Vanessa — Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Parisienne&family=Markazi+Text:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --emerald-1:#0d4433; --emerald-2:#062820; --emerald-3:#0a3428;
    --paper:#fdf8ec; --paper-edge:#f6ecd3;
    --ink:#2c2414; --ink-soft:#6e6248;
    --gold:#d4af37; --gold-deep:#a9822b; --gold-light:#eeda9d; --line:#e6d9ae;
    --ok-bg:#eaf1e6; --ok-text:#3f6b3a;
    --no-bg:#f5e6e2; --no-text:#a24f3a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{overflow-x:hidden;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(212,175,55,0.10), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(212,175,55,0.08), transparent 50%),
      linear-gradient(160deg, var(--emerald-1) 0%, var(--emerald-2) 55%, #051d16 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
    padding:22px 12px 50px;
    display:flex; flex-direction:column; align-items:center;
  }
  /* Markazi Text is the closest elegant, light-weight match to Cormorant Garamond for body copy.
     Aref Ruqaa (weight 400, not bold) pairs with Parisienne for the big script names. */
  body.lang-ar{ font-family:'Markazi Text', serif; }
  body.lang-ar .names, body.lang-ar .monogram, body.lang-ar .parents-line, body.lang-ar .rsvp h2{
    font-family:'Aref Ruqaa', serif; font-weight:400;
  }

  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, rgba(212,175,55,0.045) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-45deg, rgba(212,175,55,0.045) 0 2px, transparent 2px 34px);
  }

  .card{
    width:100%; max-width:480px;
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.25);
    overflow:hidden; position:relative; z-index:1;
  }
  .frame-outer{ position:absolute; inset:9px; border:2px solid var(--gold); pointer-events:none; z-index:3; }
  .frame-inner{ position:absolute; inset:14px; border:1px solid var(--gold-deep); pointer-events:none; z-index:3; opacity:0.6; }

  .corner{ position:absolute; width:38px; height:38px; z-index:3; pointer-events:none; }
  .corner.tl{ top:6px; left:6px; }
  .corner.tr{ top:6px; right:6px; transform:scaleX(-1); }
  .corner.bl{ bottom:6px; left:6px; transform:scaleY(-1); }
  .corner.br{ bottom:6px; right:6px; transform:scale(-1,-1); }

  /* watermark: doves + interlocking rings, faint, sits behind all text */
  .watermark{
    position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
    width:78%; max-width:320px; opacity:0.16; z-index:1; pointer-events:none;
  }

  .lang-switch{
    position:relative; z-index:4;
    display:flex; justify-content:center; gap:6px;
    padding:14px 14px 0;
  }
  .lang-btn{
    font-family:'Cormorant Garamond', serif; font-size:12px; font-weight:700; letter-spacing:0.08em;
    padding:5px 14px; border-radius:20px; border:1px solid var(--gold-deep);
    background:transparent; color:var(--gold-deep); cursor:pointer; transition:all .15s ease;
  }
  .lang-btn.active{ background:var(--emerald-2); color:var(--gold-light); border-color:var(--emerald-2); }

  .card-inner{
    padding:clamp(26px,7vw,40px) clamp(22px,6vw,42px) clamp(34px,7vw,46px);
    text-align:center; position:relative; z-index:2;
  }

  .crown{ width:40px; height:auto; margin:0 auto 10px; display:block; }

  .monogram{ font-family:'Parisienne', cursive; font-size:clamp(34px,9vw,44px); color:var(--gold-deep); margin-bottom:18px; }

  .eyebrow{ font-size:11.5px; letter-spacing:0.32em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:10px; }
  .parents-line{ font-family:'Parisienne', cursive; font-size:clamp(21px,5.5vw,26px); color:var(--ink); margin-bottom:20px; line-height:1.3; }

  .invite-copy{ font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); line-height:1.9; max-width:320px; margin:0 auto 22px; }
  body.lang-ar .invite-copy{ letter-spacing:0.02em; text-transform:none; font-size:15px; line-height:1.7; }
  body.lang-ar .eyebrow{ letter-spacing:0.1em; }

  .names{ font-family:'Parisienne', cursive; font-size:clamp(42px,12vw,58px); line-height:1.15; margin-bottom:16px; color:var(--ink); }
  .names .amp{ color:var(--gold-deep); font-size:0.65em; margin:0 4px; }
  body.lang-ar .names{ font-size:clamp(38px,10vw,50px); }

  .presented-by{ font-size:14.5px; color:var(--ink-soft); font-style:italic; max-width:340px; margin:0 auto 22px; line-height:1.55; }
  body.lang-ar .presented-by{ font-size:16px; font-style:normal; }

  .rule{ width:64px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:20px auto; position:relative; }
  .rule::before{ content:"❖"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--paper); color:var(--gold-deep); font-size:12px; padding:0 8px; }

  .date-block{ margin:6px 0 24px; }
  .date-block .day{ font-size:12.5px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold-deep); }
  .date-block .big{ font-size:clamp(20px,5.5vw,26px); letter-spacing:0.08em; margin-top:6px; font-weight:600; }
  body.lang-ar .date-block .day{ letter-spacing:0.05em; font-size:15px; }
  body.lang-ar .date-block .big{ letter-spacing:0; }

  .events{ display:flex; justify-content:center; align-items:center; gap:0; margin-bottom:4px; width:100%; }
  .event{ flex:1 1 0; max-width:210px; padding:0 12px; margin:0 auto; }
  .event + .event{ border-left:1px solid var(--line); }
  body.lang-ar .event + .event{ border-left:none; border-right:1px solid var(--line); }
  .event .label{ text-transform:uppercase; font-size:10.5px; letter-spacing:0.16em; color:var(--gold-deep); margin-bottom:6px; }
  body.lang-ar .event .label{ font-size:14px; letter-spacing:0.02em; text-transform:none; }
  .event .place{ font-size:16px; font-weight:600; line-height:1.3; }
  body.lang-ar .event .place{ font-size:18px; }
  .event .place a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--gold-light); transition:color .15s ease, border-color .15s ease; }
  .event .place a:hover{ color:var(--gold-deep); border-color:var(--gold-deep); }
  .event .sub{ font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:3px; }
  body.lang-ar .event .sub{ font-size:15px; font-style:normal; }

  .rsvp{ margin-top:32px; }
  .rsvp h2{ font-family:'Parisienne', cursive; font-weight:400; font-size:clamp(26px,7vw,32px); }
  body.lang-ar .rsvp h2{ font-size:clamp(26px,7vw,34px); }
  .rsvp .deadline{ font-style:italic; color:var(--ink-soft); font-size:14px; margin:2px 0 22px; }
  body.lang-ar .rsvp .deadline{ font-style:normal; font-size:15.5px; }

  .guest-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); text-align:left; flex-wrap:wrap; }
  body.lang-ar .guest-row{ text-align:right; }
  .guest-row:last-of-type{ border-bottom:none; }
  .guest-name{ font-size:17px; font-weight:600; flex:1 1 100%; }
  body.lang-ar .guest-name{ font-size:19px; }

  .choice{ display:flex; gap:8px; width:100%; }
  .pill{
    font-family:inherit; font-weight:600; font-size:13.5px;
    padding:11px 10px; border-radius:24px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer;
    transition:all .15s ease; flex:1; min-height:44px;
  }
  body.lang-ar .pill{ font-size:15.5px; }
  .pill:active{ transform:scale(0.97); }
  .pill.attend.active{ background:var(--ok-bg); border-color:var(--ok-text); color:var(--ok-text); }
  .pill.decline.active{ background:var(--no-bg); border-color:var(--no-text); color:var(--no-text); }

  .submit-row{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .submit-btn{
    font-family:inherit; text-transform:uppercase; letter-spacing:0.18em;
    font-size:12.5px; font-weight:700; background:var(--emerald-2); color:var(--gold-light);
    border:1px solid var(--gold); padding:15px 10px; border-radius:4px; cursor:pointer;
    transition:background .15s ease; width:100%; max-width:280px; min-height:48px;
  }
  body.lang-ar .submit-btn{ text-transform:none; letter-spacing:0.02em; font-size:16px; }
  .submit-btn:hover{ background:var(--emerald-3); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .status-msg{ font-size:13.5px; color:var(--ok-text); font-style:italic; min-height:18px; }
  .status-msg.error{ color:var(--no-text); }
  body.lang-ar .status-msg{ font-size:15px; font-style:normal; }

  .loading, .error-box{ color:var(--ink-soft); font-style:italic; padding:48px 20px; text-align:center; }
  body.lang-ar .loading, body.lang-ar .error-box{ font-style:normal; font-size:16px; }

  @media (max-width:400px){
    .events{ flex-direction:column; gap:16px; }
    .event{ margin:0 auto; }
    .event + .event{ border-left:none; border-top:1px solid var(--line); padding-top:14px; }
    body.lang-ar .event + .event{ border-right:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="frame-outer"></div>
    <div class="frame-inner"></div>

    <svg class="corner tl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#d4af37" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#d4af37" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#d4af37"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#d4af37" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#d4af37" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#d4af37"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#d4af37" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#d4af37" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#d4af37"/>
    </svg>
    <svg class="corner br" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 40 C4 20 20 4 40 4" stroke="#d4af37" stroke-width="1"/>
      <path d="M4 30 C4 16 16 4 30 4" stroke="#d4af37" stroke-width="0.8"/>
      <circle cx="4" cy="4" r="3" fill="#d4af37"/>
    </svg>

    <svg class="watermark" viewBox="0 0 260 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- left dove -->
      <path d="M40 90 C25 78 20 60 30 46 C36 38 46 35 54 39 C50 30 54 20 64 16 C68 26 66 36 58 42 C68 40 78 46 80 58 C68 56 60 62 58 70 C64 74 66 82 62 90 C56 82 48 80 42 84 C44 78 40 76 34 78 C36 82 40 86 40 90 Z" fill="#d4af37"/>
      <!-- right dove (mirrored) -->
      <path d="M220 90 C235 78 240 60 230 46 C224 38 214 35 206 39 C210 30 206 20 196 16 C192 26 194 36 202 42 C192 40 182 46 180 58 C192 56 200 62 202 70 C196 74 194 82 198 90 C204 82 212 80 218 84 C216 78 220 76 226 78 C224 82 220 86 220 90 Z" fill="#d4af37"/>
      <!-- gentle connecting flourish -->
      <path d="M96 96 C110 108 150 108 164 96" stroke="#d4af37" stroke-width="1.4" fill="none"/>
      <!-- interlocking rings -->
      <circle cx="112" cy="180" r="34" stroke="#d4af37" stroke-width="4" fill="none"/>
      <circle cx="148" cy="180" r="34" stroke="#a9822b" stroke-width="4" fill="none"/>
      <!-- small flourish above rings -->
      <path d="M80 130 C95 118 120 116 130 126 C140 116 165 118 180 130" stroke="#d4af37" stroke-width="1.2" fill="none"/>
    </svg>

    <div class="lang-switch">
      <button class="lang-btn" id="btnEn" type="button">EN</button>
      <button class="lang-btn" id="btnAr" type="button">AR · عربي</button>
    </div>

    <div class="card-inner" id="cardInner">
      <div class="loading" id="loadingText">Loading your invitation…</div>
    </div>
  </div>

<script>
/* =========================================================
   1) CONFIGURATION — Supabase project keys
   ========================================================= */
const SUPABASE_URL = "https://dthppsntdwdtvqgwwbhm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";

/* =========================================================
   2) EVENT CONTENT — one block per language.
   Edit the text on both sides so EN and AR say the same thing.
   ========================================================= */
const EVENT = {
  monogram: 'JV',
  ceremony_map_url: 'https://maps.google.com/?q=Jardins+de+l%27Olivier',   // put your real Google Maps link here
  reception_map_url: 'https://maps.google.com/?q=Domaine+Beit+Zahra',      // put your real Google Maps link here

  en: {
    parents_line: '',                     // e.g. 'The Hobeika & Fakhri Families' — leave '' to hide
    invite_copy: 'Have the pleasure of inviting you to the wedding of',
    names: 'Julien<span class="amp">&amp;</span>Vanessa',
    date_day: 'Saturday',
    date_big: 'September 12, 2026',
    ceremony_place: "Jardins de l'Olivier",
    ceremony_time: '5:30 PM',
    reception_place: 'Domaine Beit Zahra',
    reception_time: '8:00 PM',
    deadline: 'Please confirm before August 25'
  },
  ar: {
    parents_line: '',                     // مثال: 'عائلتا حبيقة وفخري' — اتركه فارغًا لإخفاء هذا السطر
    invite_copy: 'يتشرفان بدعوتكم لحضور حفل زفاف',
    names: 'جوليان<span class="amp">و</span>فانيسا',
    date_day: 'السبت',
    date_big: '12 سبتمبر 2026',
    ceremony_place: 'حدائق الزيتون',
    ceremony_time: '5:30 مساءً',
    reception_place: 'دار بيت زهرة',
    reception_time: '8:00 مساءً',
    deadline: 'يرجى تأكيد الحضور قبل 25 آب'
  }
};

const UI = {
  en: {
    ceremony_label: 'Ceremony',
    reception_label: 'Reception',
    rsvp_heading: 'Will you be there?',
    attend_btn: "I'll be there",
    decline_btn: "I can't make it",
    submit_btn: 'Send my response',
    saving: 'Saving…',
    saved_ok: 'Thank you! Your response has been recorded.',
    need_all: 'Please answer for each guest before sending.',
    error_generic: 'Something went wrong, please try again.',
    loading: 'Loading your invitation…',
    incomplete_link: "This invitation link is incomplete.<br>Please use the link that was sent to you.",
    not_found: 'Invitation not found.<br>Please check your link.'
  },
  ar: {
    ceremony_label: 'حفل الزفاف',
    reception_label: 'حفل الاستقبال',
    rsvp_heading: 'هل ستكونون معنا؟',
    attend_btn: 'سأكون حاضرًا',
    decline_btn: 'لن أتمكن من الحضور',
    submit_btn: 'إرسال ردّي',
    saving: 'جارٍ الحفظ…',
    saved_ok: 'شكرًا لكم! تم تسجيل ردّكم.',
    need_all: 'يرجى الإجابة عن كل مدعو قبل الإرسال.',
    error_generic: 'حدث خطأ، يرجى المحاولة مرة أخرى.',
    loading: 'جارٍ تحميل الدعوة…',
    incomplete_link: 'رابط الدعوة غير مكتمل.<br>يرجى استخدام الرابط الذي أُرسل إليكم.',
    not_found: 'لم يتم العثور على الدعوة.<br>يرجى التحقق من الرابط.'
  }
};
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cardInner = document.getElementById('cardInner');

function getSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get('invite');
}
function getInitialLang(){
  const params = new URLSearchParams(window.location.search);
  const l = params.get('lang');
  return (l === 'ar') ? 'ar' : 'en';
}

let currentLang = getInitialLang();
let loadState = 'loading';   // 'loading' | 'ready' | 'empty-slug' | 'not-found'
let cachedInvite = null;
let cachedGuests = null;
let draft = {}; // { guestId: 'attending'|'declined' } — persists across language switches

function applyLangChrome(){
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', currentLang === 'ar');
  document.getElementById('btnEn').classList.toggle('active', currentLang === 'en');
  document.getElementById('btnAr').classList.toggle('active', currentLang === 'ar');
}

function placeMarkup(name, url){
  return url ? `<a href="${url}" target="_blank" rel="noopener">${name}</a>` : name;
}

function paint(){
  applyLangChrome();
  const t = UI[currentLang];

  if(loadState === 'loading'){
    cardInner.innerHTML = `<div class="loading">${t.loading}</div>`;
    return;
  }
  if(loadState === 'empty-slug'){
    cardInner.innerHTML = `<div class="error-box">${t.incomplete_link}</div>`;
    return;
  }
  if(loadState === 'not-found'){
    cardInner.innerHTML = `<div class="error-box">${t.not_found}</div>`;
    return;
  }
  renderShell(cachedInvite, cachedGuests);
}

function renderShell(invite, guests){
  const t = UI[currentLang];
  const e = EVENT[currentLang];

  cardInner.innerHTML = `
    <svg class="crown" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 50 L14 22 L30 38 L50 14 L70 38 L86 22 L90 50 Z" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
      <circle cx="14" cy="20" r="3" fill="#d4af37"/>
      <circle cx="50" cy="12" r="3.4" fill="#d4af37"/>
      <circle cx="86" cy="20" r="3" fill="#d4af37"/>
      <line x1="10" y1="53" x2="90" y2="53" stroke="#d4af37" stroke-width="2.2"/>
    </svg>

    <div class="monogram">${EVENT.monogram}</div>

    ${e.parents_line ? `
      <div class="parents-line">${e.parents_line}</div>
    ` : ''}

    <div class="invite-copy">${e.invite_copy}</div>

    <div class="names">${e.names}</div>
    <p class="presented-by">${invite.note || ''}</p>

    <div class="rule"></div>

    <div class="date-block">
      <div class="day">${e.date_day}</div>
      <div class="big">${e.date_big}</div>
    </div>

    <div class="events">
      <div class="event">
        <div class="label">${t.ceremony_label}</div>
        <div class="place">${placeMarkup(e.ceremony_place, EVENT.ceremony_map_url)}</div>
        <div class="sub">${e.ceremony_time}</div>
      </div>
      <div class="event">
        <div class="label">${t.reception_label}</div>
        <div class="place">${placeMarkup(e.reception_place, EVENT.reception_map_url)}</div>
        <div class="sub">${e.reception_time}</div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="rsvp">
      <h2>${t.rsvp_heading}</h2>
      <div class="deadline">${e.deadline}</div>
      <div id="guestRows"></div>
      <div class="submit-row">
        <button class="submit-btn" id="submitBtn">${t.submit_btn}</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>
  `;

  function renderRows(){
    const rowsEl = document.getElementById('guestRows');
    rowsEl.innerHTML = '';
    guests.forEach(g => {
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-name">${g.member_name}</div>
        <div class="choice">
          <button class="pill attend ${draft[g.id]==='attending'?'active':''}">${t.attend_btn}</button>
          <button class="pill decline ${draft[g.id]==='declined'?'active':''}">${t.decline_btn}</button>
        </div>`;
      const [attendBtn, declineBtn] = row.querySelectorAll('.pill');
      attendBtn.onclick = () => { draft[g.id] = 'attending'; renderRows(); };
      declineBtn.onclick = () => { draft[g.id] = 'declined'; renderRows(); };
      rowsEl.appendChild(row);
    });
  }
  renderRows();

  document.getElementById('submitBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');
    const allAnswered = guests.every(g => draft[g.id] === 'attending' || draft[g.id] === 'declined');
    if(!allAnswered){
      statusMsg.textContent = t.need_all;
      statusMsg.className = 'status-msg error';
      return;
    }
    submitBtn.disabled = true;
    statusMsg.textContent = t.saving;
    statusMsg.className = 'status-msg';

    try{
      for(const g of guests){
        const { error } = await sb.from('guests')
          .update({ status: draft[g.id], responded_at: new Date().toISOString() })
          .eq('id', g.id);
        if(error) throw error;
        g.status = draft[g.id];
      }
      statusMsg.textContent = t.saved_ok;
      statusMsg.className = 'status-msg';
    }catch(err){
      console.error(err);
      statusMsg.textContent = t.error_generic;
      statusMsg.className = 'status-msg error';
    }
    submitBtn.disabled = false;
  };
}

document.getElementById('btnEn').onclick = () => { currentLang = 'en'; paint(); };
document.getElementById('btnAr').onclick = () => { currentLang = 'ar'; paint(); };

async function init(){
  applyLangChrome();
  const slug = getSlug();
  if(!slug){
    loadState = 'empty-slug';
    paint();
    return;
  }
  try{
    const { data: invite, error: inviteErr } = await sb.from('invites').select('*').eq('slug', slug).single();
    if(inviteErr || !invite) throw new Error('invite not found');

    const { data: guests, error: guestsErr } = await sb.from('guests').select('*').eq('invite_slug', slug).order('member_name');
    if(guestsErr) throw guestsErr;

    cachedInvite = invite;
    cachedGuests = guests;
    guests.forEach(g => { draft[g.id] = g.status; });
    loadState = 'ready';
    paint();
  }catch(e){
    console.error(e);
    loadState = 'not-found';
    paint();
  }
}

init();
</script>
</body>
</html>
