<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Guest Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>

:root{
  --forest:#17261d;
  --forest-2:#20352a;
  --forest-3:#294435;

  --ivory:#f8f4ea;
  --ivory-2:#f2ecdf;
  --cream:#fffdf8;

  --champagne:#c9a66b;
  --champagne-light:#ddc79d;
  --gold-dark:#9b7841;

  --ink:#27271f;
  --muted:#777264;

  --line:rgba(55,50,38,.12);

  --success:#50785a;
  --success-bg:#e8f0e7;

  --danger:#a65d4b;
  --danger-bg:#f5e8e3;

  --pending:#9a8147;
  --pending-bg:#f3ecd9;

  --shadow:0 25px 70px rgba(0,0,0,.20);
}

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  background:
    radial-gradient(circle at 10% 10%,rgba(201,166,107,.09),transparent 25%),
    radial-gradient(circle at 90% 90%,rgba(201,166,107,.06),transparent 25%),
    linear-gradient(135deg,var(--forest),var(--forest-2));

  color:var(--ink);

  font-family:'Inter',sans-serif;

  padding:28px 18px 70px;
}

/* =========================
   PAGE
========================= */

.wrap{
  width:100%;
  max-width:1100px;
  margin:auto;
}

.panel{
  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.97),
      rgba(248,244,234,.98)
    );

  border:1px solid rgba(255,255,255,.35);

  border-radius:24px;

  padding:38px;

  box-shadow:var(--shadow);

  overflow:hidden;
}

.panel::before{
  content:"";

  position:absolute;

  width:360px;
  height:360px;

  right:-180px;
  top:-180px;

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(201,166,107,.12),
    transparent 70%
  );

  pointer-events:none;
}

/* =========================
   TYPOGRAPHY
========================= */

h1,
h2,
h3,
.fam-title{
  font-family:'Cormorant Garamond',serif;
}

.brand-title{
  font-family:'Parisienne',cursive;
  font-weight:400;
  font-size:42px;
  line-height:1;
}

.sub{
  color:var(--muted);
  font-family:'Cormorant Garamond',serif;
  font-size:17px;
  font-style:italic;
  margin-top:8px;
}

.eyebrow{
  color:var(--champagne);
  font-size:10px;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
}

/* =========================
   LOGIN
========================= */

.lock-screen{
  min-height:520px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  position:relative;
}

.lock-symbol{
  width:78px;
  height:78px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:25px;

  color:var(--champagne);

  border:1px solid rgba(201,166,107,.55);

  font-family:'Cormorant Garamond',serif;
  font-size:30px;

  background:rgba(201,166,107,.07);
}

.lock-screen .brand-title{
  font-size:44px;
}

.lock-screen .sub{
  margin-bottom:30px;
}

.lock-form{
  width:100%;
  max-width:330px;
}

.lock-form input{
  text-align:center;
  height:50px;
  margin-bottom:12px;
}

.lock-button{
  width:100%;
}

/* =========================
   INPUTS
========================= */

input,
textarea,
select{

  width:100%;

  border:1px solid var(--line);

  border-radius:12px;

  background:rgba(255,255,255,.72);

  color:var(--ink);

  font-family:'Inter',sans-serif;

  font-size:13px;

  padding:12px 14px;

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:focus,
textarea:focus,
select:focus{

  border-color:var(--champagne);

  background:white;

  box-shadow:
    0 0 0 4px rgba(201,166,107,.10);
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* =========================
   BUTTONS
========================= */

button{
  font-family:'Inter',sans-serif;
}

.btn{

  border:0;

  background:var(--forest);

  color:var(--ivory);

  border-radius:30px;

  padding:11px 18px;

  font-size:12px;

  font-weight:600;

  letter-spacing:.02em;

  transition:
    transform .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

.btn:hover{
  background:var(--forest-3);
  transform:translateY(-1px);
}

.btn:active{
  transform:translateY(0);
}

.btn.secondary{

  background:transparent;

  color:var(--ink);

  border:1px solid var(--line);
}

.btn.secondary:hover{

  background:white;

  border-color:var(--champagne);
}

.btn.danger{

  background:transparent;

  color:var(--danger);

  border:1px solid rgba(166,93,75,.22);
}

.btn.danger:hover{
  background:var(--danger-bg);
}

.btn.small{
  padding:8px 13px;
  font-size:11px;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   HEADER
========================= */

.dashboard-header{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:20px;

  padding-bottom:30px;

  border-bottom:1px solid var(--line);
}

.header-right{

  display:flex;
  align-items:center;
  gap:8px;
}

.status-pill{

  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 12px;

  border-radius:30px;

  background:rgba(80,120,90,.09);

  color:var(--success);

  font-size:10px;
  font-weight:600;

  letter-spacing:.08em;
  text-transform:uppercase;
}

.status-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--success);
}

/* =========================
   STATS
========================= */

.stats-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin:26px 0 34px;
}

.stat{

  position:relative;

  padding:19px;

  background:rgba(255,255,255,.60);

  border:1px solid var(--line);

  border-radius:16px;

  cursor:pointer;

  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.stat:hover{

  transform:translateY(-3px);

  border-color:rgba(201,166,107,.5);

  box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.stat.active{

  border-color:var(--champagne);

  box-shadow:
    0 0 0 1px var(--champagne),
    0 12px 28px rgba(0,0,0,.06);
}

.stat-label{

  color:var(--muted);

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.13em;

  font-weight:600;
}

.stat-number{

  font-family:'Cormorant Garamond',serif;

  font-size:38px;

  line-height:1;

  margin-top:7px;

  font-weight:600;
}

.stat-icon{

  position:absolute;

  right:16px;
  top:17px;

  color:var(--champagne);

  font-family:'Cormorant Garamond',serif;

  font-size:20px;
}

/* =========================
   SECTION TITLES
========================= */

.section-heading{

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:15px;

  margin-bottom:16px;
}

.section-title{

  font-family:'Cormorant Garamond',serif;

  font-size:27px;

  font-weight:600;
}

.section-description{

  color:var(--muted);

  font-size:11px;

  margin-top:3px;
}

/* =========================
   ADD FAMILY
========================= */

.add-box{

  position:relative;

  padding:25px;

  margin-bottom:32px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(242,236,223,.92),
      rgba(255,253,248,.94)
    );

  border:1px solid rgba(201,166,107,.30);

  overflow:hidden;
}

.add-box::after{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-80px;
  bottom:-100px;

  border-radius:50%;

  border:1px solid rgba(201,166,107,.18);
}

.add-box h2{

  font-family:'Cormorant Garamond',serif;

  font-size:28px;

  font-weight:600;

  margin-bottom:3px;
}

.add-subtitle{

  color:var(--muted);

  font-size:11px;

  margin-bottom:20px;
}

.form-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;
}

.field{

  margin-bottom:13px;
}

.field.full{
  grid-column:1/-1;
}

.field label{

  display:block;

  color:var(--muted);

  font-size:9px;

  font-weight:600;

  text-transform:uppercase;

  letter-spacing:.12em;

  margin-bottom:7px;
}

.member-rows{

  display:flex;

  flex-direction:column;

  gap:8px;

  margin-bottom:9px;
}

.member-row{

  display:flex;

  gap:8px;

  align-items:center;
}

.member-row input{
  flex:1;
}

.remove-row-btn{

  width:36px;
  height:36px;

  border-radius:50%;

  border:1px solid rgba(166,93,75,.20);

  background:transparent;

  color:var(--danger);

  cursor:pointer;
}

.remove-row-btn:hover{
  background:var(--danger-bg);
}

.add-box-actions{

  display:flex;

  align-items:center;

  gap:12px;

  margin-top:4px;
}

.form-msg{

  font-size:11px;

  color:var(--muted);
}

.form-msg.error{
  color:var(--danger);
}

.form-msg.ok{
  color:var(--success);
}

/* =========================
   SEARCH
========================= */

.list-toolbar{

  display:flex;

  gap:10px;

  margin-bottom:18px;
}

.search-wrapper{

  flex:1;

  position:relative;
}

.search-wrapper span{

  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  color:var(--champagne);

  font-size:14px;
}

.search-wrapper input{
  padding-left:38px;
}

.list-toolbar select{
  max-width:190px;
}

/* =========================
   FAMILY CARDS
========================= */

.family-list{

  display:flex;

  flex-direction:column;

  gap:13px;
}

.fam-card{

  position:relative;

  background:rgba(255,255,255,.73);

  border:1px solid var(--line);

  border-radius:18px;

  padding:21px;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}

.fam-card:hover{

  transform:translateY(-2px);

  border-color:rgba(201,166,107,.35);

  box-shadow:
    0 12px 30px rgba(0,0,0,.06);
}

.fam-head{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:15px;

  padding-bottom:15px;

  border-bottom:1px solid var(--line);
}

.family-main{
  min-width:0;
}

.family-kicker{

  color:var(--champagne);

  font-size:9px;

  font-weight:600;

  letter-spacing:.15em;

  text-transform:uppercase;

  margin-bottom:4px;
}

.fam-title{

  font-size:27px;

  font-weight:600;

  cursor:pointer;

  line-height:1.05;
}

.fam-title:hover{
  color:var(--gold-dark);
}

.fam-note{

  color:var(--muted);

  font-family:'Cormorant Garamond',serif;

  font-size:15px;

  font-style:italic;

  margin-top:5px;

  cursor:pointer;

  max-width:650px;
}

.fam-note:hover{
  color:var(--ink);
}

.fam-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* =========================
   MEMBERS
========================= */

.member-list{
  margin-top:12px;
}

.member-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:10px 0;

  border-bottom:1px solid rgba(55,50,38,.08);
}

.member-item:last-child{
  border-bottom:0;
}

.member-item-name{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:8px;

  cursor:pointer;

  font-family:'Cormorant Garamond',serif;

  font-size:18px;

  font-weight:500;
}

.member-item-name:hover{
  color:var(--gold-dark);
}

.member-item-right{
  display:flex;
  align-items:center;
  gap:5px;
}

.del-member-btn{

  width:30px;
  height:30px;

  border-radius:50%;

  border:0;

  background:transparent;

  color:#9c988d;

  cursor:pointer;
}

.del-member-btn:hover{
  background:var(--danger-bg);
  color:var(--danger);
}

/* =========================
   BADGES
========================= */

.badge{

  display:inline-flex;

  align-items:center;

  gap:5px;

  border-radius:30px;

  padding:4px 9px;

  font-family:'Inter',sans-serif;

  font-size:9px;

  font-weight:600;

  letter-spacing:.02em;
}

.badge::before{

  content:"";

  width:5px;
  height:5px;

  border-radius:50%;

  background:currentColor;
}

.badge.attending{
  background:var(--success-bg);
  color:var(--success);
}

.badge.declined{
  background:var(--danger-bg);
  color:var(--danger);
}

.badge.pending{
  background:var(--pending-bg);
  color:var(--pending);
}

/* =========================
   ADD MEMBER
========================= */

.add-member-row{

  display:flex;

  gap:8px;

  margin-top:10px;

  padding-top:3px;
}

.add-member-row input{
  flex:1;
}

/* =========================
   FOOTER / LINK
========================= */

.fam-footer{

  display:flex;

  align-items:center;

  gap:9px;

  margin-top:15px;

  padding-top:14px;

  border-top:1px solid var(--line);
}

.link-box{
  flex:1;
}

.link-box input{

  background:var(--ivory-2);

  color:var(--muted);

  font-family:'Inter',sans-serif;

  font-size:10px;

  height:36px;
}

.copied-tag{

  color:var(--success);

  font-size:10px;

  font-weight:600;

  white-space:nowrap;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading,
.empty{

  text-align:center;

  color:var(--muted);

  font-family:'Cormorant Garamond',serif;

  font-size:17px;

  font-style:italic;

  padding:45px 20px;
}

.empty::before{

  content:"✦";

  display:block;

  color:var(--champagne);

  font-size:22px;

  margin-bottom:6px;
}

/* =========================
   DECORATION
========================= */

.ornament{

  display:flex;

  align-items:center;

  gap:10px;

  margin:7px 0 0;
}

.ornament::before,
.ornament::after{

  content:"";

  height:1px;

  width:35px;

  background:var(--champagne);
}

.ornament span{
  color:var(--champagne);
  font-size:9px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

  body{
    padding:12px 8px 40px;
  }

  .panel{
    padding:24px 17px 30px;
    border-radius:20px;
  }

  .dashboard-header{
    flex-direction:column;
  }

  .header-right{
    width:100%;
    justify-content:flex-start;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .list-toolbar{
    flex-direction:column;
  }

  .list-toolbar select{
    max-width:none;
  }

  .fam-head{
    flex-direction:column;
  }

  .fam-actions{
    width:100%;
  }

  .fam-actions .btn{
    flex:1;
  }

  .fam-footer{
    flex-wrap:wrap;
  }

  .link-box{
    flex-basis:100%;
  }

}

@media(max-width:480px){

  .brand-title{
    font-size:36px;
  }

  .lock-screen .brand-title{
    font-size:38px;
  }

  .stats-grid{
    gap:8px;
  }

  .stat{
    padding:14px;
  }

  .stat-number{
    font-size:31px;
  }

  .add-box{
    padding:18px;
  }

  .add-box-actions{
    flex-direction:column;
    align-items:stretch;
  }

  .add-box-actions .btn{
    width:100%;
  }

  .fam-card{
    padding:17px;
  }

  .fam-title{
    font-size:24px;
  }

  .member-item-name{
    font-size:17px;
  }

}

/* =========================
   SUBTLE ANIMATION
========================= */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.fam-card{
  animation:fadeUp .35s ease both;
}

</style>
</head>

<body>

<div class="wrap">

<div class="panel" id="panel">

  <!-- ======================
       LOGIN
  ======================= -->

  <div class="lock-screen" id="lockScreen">

    <div class="lock-symbol">✦</div>

    <div class="eyebrow">Private wedding dashboard</div>

    <div class="brand-title">
      Gestion des invités
    </div>

    <div class="ornament">
      <span>✦</span>
    </div>

    <p class="sub">
      Accès réservé aux organisateurs
    </p>

    <div class="lock-form">

      <input
        type="password"
        id="passInput"
        placeholder="Code d'accès"
        autocomplete="off"
      >

      <div
        class="msg"
        id="lockMsg"
        style="min-height:18px;margin-bottom:8px;"
      ></div>

      <button
        class="btn lock-button"
        id="unlockBtn"
      >
        Accéder au tableau de bord
      </button>

    </div>

  </div>

</div>

</div>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://dthppsntdwdtvqgwwbhm.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Vv0Xsv71M5Xf--EUXXYm2A_r2KD_o53";


/*
   IMPORTANT :
   Le code ci-dessous reste identique à ton fonctionnement actuel.
*/

const ADMIN_PASSCODE = "1234";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const panel = document.getElementById("panel");


/* =========================================================
   LOGIN
========================================================= */

document.getElementById("unlockBtn").onclick = () => {

  const val =
    document.getElementById("passInput").value;

  if(val === ADMIN_PASSCODE){

    loadDashboard();

  }else{

    document.getElementById("lockMsg").textContent =
      "Code incorrect.";

  }

};


document
  .getElementById("passInput")
  .addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

      document
        .getElementById("unlockBtn")
        .click();

    }

  });


/* =========================================================
   HELPERS
========================================================= */

function slugify(str){

  return str
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-");

}


function inviteUrl(slug){

  const base =
    window.location.href.replace(/admin\.html.*$/,"");

  return base + "?invite=" + slug;

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   DATA
========================================================= */

let invites = [];
let guests = [];

let memberRowCount = 0;

let currentStatusFilter = "all";


/* =========================================================
   FETCH
========================================================= */

async function fetchAll(){

  const {
    data: inv,
    error: e1
  } = await sb
    .from("invites")
    .select("*");

  if(e1) throw e1;


  const {
    data: gs,
    error: e2
  } = await sb
    .from("guests")
    .select("*");

  if(e2) throw e2;


  invites = inv || [];

  guests = gs || [];

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard(){

  panel.innerHTML = `
    <div class="loading">
      Chargement de votre espace…
    </div>
  `;

  try{

    await fetchAll();

    renderDashboard();

  }catch(e){

    console.error(e);

    panel.innerHTML = `
      <div class="loading">

        Impossible de charger le tableau de bord.

        <br><br>

        Vérifie la configuration Supabase
        et les permissions.

      </div>
    `;

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  let total = 0;
  let attending = 0;
  let declined = 0;
  let pending = 0;


  guests.forEach(g => {

    total++;

    if(g.status === "attending")
      attending++;

    else if(g.status === "declined")
      declined++;

    else

/* =========================================================
   STAT FILTER
========================================================= */

function syncStatFilterUI(){

  document
    .querySelectorAll(".stat")
    .forEach(el => {

      el.classList.toggle(
        "active",
        el.dataset.status === currentStatusFilter
      );

    });

}


/* =========================================================
   ADD MEMBER ROW
========================================================= */

function addMemberRow(){

  memberRowCount++;

  const rows =
    document.getElementById("memberRows");

  const row =
    document.createElement("div");

  row.className = "member-row";


  row.innerHTML = `

    <input
      type="text"
      placeholder="Prénom Nom"
    >

    <button
      class="remove-row-btn"
      type="button"
      title="Retirer"
    >
      ×
    </button>

  `;


  row
    .querySelector(".remove-row-btn")
    .onclick = () => row.remove();


  rows.appendChild(row);

}


/* =========================================================
   SAVE FAMILY
========================================================= */

async function handleSaveFamily(){

  const nameInput =
    document.getElementById("newFamilyName");

  const noteInput =
    document.getElementById("newFamilyNote");

  const formMsg =
    document.getElementById("formMsg");

  const saveBtn =
    document.getElementById("saveFamilyBtn");


  const familyName =
    nameInput.value.trim();

  const note =
    noteInput.value.trim();


  const memberNames =
    Array
      .from(
        document.querySelectorAll(
          "#memberRows input"
        )
      )
      .map(i => i.value.trim())
      .filter(Boolean);


  if(!familyName){

    formMsg.textContent =
      "Merci d'indiquer un nom de famille.";

    formMsg.className =
      "form-msg error";

    return;

  }


  if(memberNames.length === 0){

    formMsg.textContent =
      "Ajoute au moins un invité.";

    formMsg.className =
      "form-msg error";

    return;

  }


  let slug =
    slugify(familyName);


  const existingSlugs =
    new Set(
      invites.map(i => i.slug)
    );


  if(existingSlugs.has(slug)){

    let n = 2;

    while(
      existingSlugs.has(
        slug + "-" + n
      )
    ){

      n++;

    }

    slug =
      slug + "-" + n;

  }


  saveBtn.disabled = true;

  formMsg.textContent =
    "Création de l'invitation…";

  formMsg.className =
    "form-msg";


  try{

    const {
      error:e1
    } = await sb
      .from("invites")
      .insert({

        slug,

        family_name:
          familyName,

        note

      });


    if(e1) throw e1;


    const {
      error:e2
    } = await sb
      .from("guests")
      .insert(

        memberNames.map(n => ({

          invite_slug:
            slug,

          member_name:
            n

        }))

      );


    if(e2) throw e2;


    await fetchAll();

    renderDashboard();


  }catch(e){

    console.error(e);

    formMsg.textContent =
      "Erreur lors de l'enregistrement.";

    formMsg.className =
      "form-msg error";

    saveBtn.disabled = false;

  }

}


/* =========================================================
   FAMILY LIST
========================================================= */

function renderFamilyList(){

  const search =
    (
      document.getElementById(
        "searchInput"
      ).value || ""
    ).toLowerCase();


  const statusFilter =
    currentStatusFilter;


  const listEl =
    document.getElementById(
      "familyList"
    );


  listEl.innerHTML = "";


  const matchesSearch =
    (inv) => {

      if(!search)
        return true;


      if(
        inv.family_name
          .toLowerCase()
          .includes(search)
      )
        return true;


      return guests.some(g =>

        g.invite_slug === inv.slug &&

        g.member_name
          .toLowerCase()
          .includes(search)

      );

    };


  const filtered =
    invites.filter(inv => {

      if(!matchesSearch(inv))
        return false;


      if(statusFilter === "all")
        return true;


      return guests.some(g =>

        g.invite_slug === inv.slug &&

        g.status === statusFilter

      );

    });


  if(filtered.length === 0){

    const label =
      statusFilter === "attending"
        ? "présent"
        : statusFilter === "declined"
          ? "décliné"
          : statusFilter === "pending"
            ? "en attente"
            : "";


    listEl.innerHTML = `

      <div class="empty">

        Aucun invité
        ${label ? label + " " : ""}
        trouvé.

      </div>

    `;

    return;

  }


  filtered.forEach(inv => {

    let members =
      guests.filter(
        g =>
          g.invite_slug === inv.slug
      );


    if(statusFilter !== "all"){

      members =
        members.filter(
          g =>
            g.status === statusFilter
        );

    }


    const card =
      document.createElement("div");

    card.className =
      "fam-card";


    card.innerHTML = `

      <div class="fam-head">

        <div class="family-main">

          <div class="family-kicker">
            Invitation privée
          </div>

          <div
            class="fam-title"
            data-role="edit-name"
            title="Cliquer pour modifier"
          >
            ${escapeHtml(inv.family_name)}
          </div>

          <div
            class="fam-note"
            data-role="edit-note"
            title="Cliquer pour modifier"
          >
            ${
              inv.note
                ? escapeHtml(inv.note)
                : "+ Ajouter un message personnalisé"
            }
          </div>

        </div>


        <div class="fam-actions">

          <button
            class="btn danger small"
            data-role="delete-family"
          >
            Supprimer
          </button>

        </div>

      </div>


      <div
        class="member-list"
        data-role="member-list"
      ></div>


      <div class="add-member-row">

        <input
          type="text"
          placeholder="Ajouter un invité à ce foyer…"
          data-role="new-member-input"
        >

        <button
          class="btn secondary small"
          data-role="add-member"
        >
          Ajouter
        </button>

      </div>


      <div class="fam-footer">

        <div class="link-box">

          <input
            type="text"
            readonly
            value="${escapeHtml(
              inviteUrl(inv.slug)
            )}"
            data-role="link-input"
          >

        </div>


        <button
          class="btn small"
          data-role="copy-link"
        >
          Copier le lien
        </button>


        <span
          class="copied-tag"
          data-role="copied-tag"
          style="display:none"
        >
          Copié ✓
        </span>

      </div>

    `;


    /* MEMBERS */

    const memberListEl =
      card.querySelector(
        '[data-role="member-list"]'
      );


    if(members.length === 0){

      memberListEl.innerHTML = `

        <div class="empty"
             style="padding:15px 0;font-size:14px">

          Aucun invité pour l'instant.

        </div>

      `;

    }


    members.forEach(m => {

      const label =
        m.status === "attending"
          ? "Présent"
          : m.status === "declined"
            ? "Décliné"
            : "En attente";


      const item =
        document.createElement("div");

      item.className =
        "member-item";


      item.innerHTML = `

        <div
          class="member-item-name"
          title="Cliquer pour renommer"
        >

          ${escapeHtml(m.member_name)}

          <span
            class="badge ${m.status}"
          >
            ${label}
          </span>

        </div>


        <div class="member-item-right">

          <button
            class="del-member-btn"
            title="Retirer cet invité"
          >
            ×
          </button>

        </div>

      `;


      item
        .querySelector(
          ".member-item-name"
        )
        .onclick = () =>
          renameMember(m,item);


      item
        .querySelector(
          ".del-member-btn"
        )
        .onclick = () =>
          deleteMember(m);


      memberListEl.appendChild(item);

    });


    /* ADD MEMBER */

    card
      .querySelector(
        '[data-role="add-member"]'
      )
      .onclick = async () => {

        const input =
          card.querySelector(
            '[data-role="new-member-input"]'
          );


        const name =
          input.value.trim();


        if(!name) return;


        try{

          const {error} =
            await sb
              .from("guests")
              .insert({

                invite_slug:
                  inv.slug,

                member_name:
                  name

              });


          if(error)
            throw error;


          await fetchAll();

          renderFamilyList();


        }catch(e){

          console.error(e);

          alert(
            "Erreur lors de l'ajout de l'invité."
          );

        }

      };


    /* EDIT FAMILY NAME */

    card
      .querySelector(
        '[data-role="edit-name"]'
      )
      .onclick = (ev) => {

        const el =
          ev.currentTarget;


        const input =
          document.createElement("input");


        input.value =
          inv.family_name;


        input.style.fontSize =
          "22px";


        input.style.fontFamily =
          "'Cormorant Garamond',serif";


        el.replaceWith(input);

        input.focus();


        const commit =
          async () => {

            const newVal =
              input.value.trim()
              || inv.family_name;


            try{

              const {error} =
                await sb
                  .from("invites")
                  .update({
                    family_name:newVal
                  })
                  .eq(
                    "slug",
                    inv.slug
                  );


              if(error)
                throw error;


              await fetchAll();

              renderFamilyList();


            }catch(e){

              console.error(e);

              renderFamilyList();

            }

          };


        input.addEventListener(
          "blur",
          commit
        );


        input.addEventListener(
          "keydown",
          e => {

            if(e.key === "Enter")
              input.blur();

          }
        );

      };


    /* EDIT NOTE */

    card
      .querySelector(
        '[data-role="edit-note"]'
      )
      .onclick = (ev) => {

        const el =
          ev.currentTarget;


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          inv.note || "";


        textarea.style.fontFamily =
          "'Cormorant Garamond',serif";


        textarea.style.fontSize =
          "15px";


        el.replaceWith(
          textarea
        );


        textarea.focus();


        const commit =
          async () => {

            const newVal =
              textarea.value.trim();


            try{

              const {error} =
                await sb
                  .from("invites")
                  .update({
                    note:newVal
                  })
                  .eq(
                    "slug",
                    inv.slug
                  );


              if(error)
                throw error;


              await fetchAll();

              renderFamilyList();


            }catch(e){

              console.error(e);

              renderFamilyList();

            }

          };


        textarea.addEventListener(
          "blur",
          commit
        );

      };


    /* DELETE FAMILY */

    card
      .querySelector(
        '[data-role="delete-family"]'
      )
      .onclick = async () => {

        if(
          !confirm(
            `Supprimer "${inv.family_name}" et tous ses invités ? Cette action est irréversible.`
          )
        )
          return;


        try{

          const {error} =
            await sb
              .from("invites")
              .delete()
              .eq(
                "slug",
                inv.slug
              );


          if(error)
            throw error;


          await fetchAll();

          renderFamilyList();


        }catch(e){

          console.error(e);

          alert(
            "Erreur lors de la suppression."
          );

        }

      };


    /* COPY LINK */

    card
      .querySelector(
        '[data-role="copy-link"]'
      )
      .onclick = async () => {

        const url =
          inviteUrl(inv.slug);


        const tag =
          card.querySelector(
            '[data-role="copied-tag"]'
          );


        try{

          await navigator
            .clipboard
            .writeText(url);


        }catch(e){

          const linkInput =
            card.querySelector(
              '[data-role="link-input"]'
            );


          linkInput.select();

          document.execCommand(
            "copy"
          );

        }


        tag.style.display =
          "inline";


        setTimeout(
          () => {

            tag.style.display =
              "none";

          },
          1800
        );

      };


    listEl.appendChild(card);

  });

}


/* =========================================================
   RENAME MEMBER
========================================================= */

async function renameMember(
  m,
  itemEl
){

  const nameEl =
    itemEl.querySelector(
      ".member-item-name"
    );


  const input =
    document.createElement(
      "input"
    );


  input.value =
    m.member_name;


  nameEl.replaceWith(
    input
  );


  input.focus();


  const commit =
    async () => {

      const newVal =
        input.value.trim()
        || m.member_name;


      try{

        const {error} =
          await sb
            .from("guests")
            .update({
              member_name:newVal
            })
            .eq(
              "id",
              m.id
            );


        if(error)
          throw error;


        await fetchAll();

        renderFamilyList();


      }catch(e){

        console.error(e);

        renderFamilyList();

      }

    };


  input.addEventListener(
    "blur",
    commit
  );


  input.addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter")
        input.blur();

    }
  );

}


/* =========================================================
   DELETE MEMBER
========================================================= */

async function deleteMember(m){

  if(
    !confirm(
      `Retirer ${m.member_name} de la liste ?`
    )
  )
    return;


  try{

    const {error} =
      await sb
        .from("guests")
        .delete()
        .eq(
          "id",
          m.id
        );


    if(error)
      throw error;


    await fetchAll();

    renderFamilyList();


  }catch(e){

    console.error(e);

    alert(
      "Erreur lors de la suppression."
    );

  }

}
